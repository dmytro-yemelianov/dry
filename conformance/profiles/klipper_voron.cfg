# Voron 2.4 350mm — Klipper printer.cfg fixture for dry import-printer-cfg tests.
# Exercises: [printer] kinematics/max_accel/SCV, all three stepper position_max values
# (so build_volume is populated), [extruder], [firmware_retraction], and [input_shaper]
# (to trigger the deferred-warning path).

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
square_corner_velocity: 5.0
max_z_velocity: 15
max_z_accel: 350

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: PG6
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 50

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 50

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 40
endstop_pin: PG10
position_min: -5
position_max: 310
homing_speed: 10

[extruder]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 22.6789511
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PA2
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF4
min_temp: 10
max_temp: 270
min_extrude_temp: 170
pressure_advance: 0.04
max_extrude_only_distance: 100

[firmware_retraction]
retract_length: 0.5
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

[input_shaper]
shaper_freq_x: 59.8
shaper_freq_y: 38.6
shaper_type: mzv
