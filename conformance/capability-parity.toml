# Cross-target capability reachability — the contract `docs/14-known-limitations.md` describes.
#
# The parity gap in this repo opened silently and in both directions: kernel capabilities landed
# without reaching any binding (the Phase 7/8 lookahead optimiser and physics simulator), and other
# capabilities reached every binding while never getting a CLI surface (B-Rep slicing, dexel
# simulation). Nothing caught either, because nothing asserted anything — the docs carried a table
# that was a snapshot of whatever happened to be true when someone last looked, and it was wrong in
# two cells the first time it was written.
#
# This file is that table made executable. `tools/check_capability_parity.py` reads it and checks
# every declared cell against the source, in BOTH directions:
#
#   status = "reachable"  ⇒ `symbol` MUST appear in `path`
#   status = "absent"     ⇒ `symbol` MUST NOT appear in `path`
#
# So adding a binding without recording it fails, and recording one without adding it fails. An
# `absent` row is a deliberate, reviewed gap, not an oversight — each carries a `note` saying so.
#
# Surfaces legitimately call different entry points (the CLI reaches pocket generation through
# `try_pocket_design` while the bindings use `try_pocket_ops`), so the symbol is recorded per
# surface rather than assumed to be shared.

schema_version = 1

[[capability]]
id = "tpms"
title = "TPMS lattice infill generation"
core = { path = "crates/core/src/generate/tpms.rs", symbol = "pub fn try_tpms_ops", status = "reachable" }
cli = { path = "crates/cli/src/main.rs", symbol = "GenerateCmd::Tpms", status = "reachable" }
python = { path = "py/src/lib.rs", symbol = "tpms_ops_json", status = "reachable" }
wasm = { path = "crates/wasm/src/lib.rs", symbol = "tpms_ops_json", status = "reachable" }
ts = { path = "sdk/ts/src/engine.ts", symbol = "export function tpmsOps", status = "reachable" }

