# Binding exports with no capability row yet — a visible, gated backlog, not a silent allowlist.
#
# The rows above cover 13 capabilities. The wasm binding exports 34 functions and the PyO3 module
# 22, and until the 2026-09-05 audit nothing said so. That silence is what let the machine
# compatibility check be reimplemented in `py/python/dry/__init__.py` and `sdk/ts/src/design.ts`
# with two of the engine's seven rules missing: no row covered it, so the gate had nothing to check
# and the two SDKs passed arcs the engine refuses.
#
# `tools/check_capability_parity.py` fails when a binding export is neither covered by a row above
# nor listed here, so a *new* export cannot be added unrecorded. It also fails when an entry here is
# stale — the export vanished, or it gained a row — so the ledger cannot rot into an allowlist that
# quietly outlives its reasons.
#
# Each name below is a row still to be written, not a decision that it never should be.
[uncovered]
