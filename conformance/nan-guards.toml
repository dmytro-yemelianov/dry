# ---------------------------------------------------------------------------------------------
# safe — the ordering result is fail-safe, or a non-finite value cannot reach the comparison
# ---------------------------------------------------------------------------------------------

[[site]]
function = "contains"
parameter = "val"
status = "safe"
why = "`AxisRange::contains` answers 'is this point inside the envelope'. `NaN >= min && NaN <= max` is false, so a non-finite coordinate is reported *outside* the envelope — the conservative answer. Fail-safe by the polarity of the question, not by accident, but worth recording so a future inversion of that polarity is noticed."

[[site]]
function = "adaptive_speed_with_kinematics"
parameter = "a_limit"
status = "safe"
why = "Measured: a NaN, negative or zero acceleration limit leaves every segment speed unchanged. The limit is only ever used to compute a ceiling that is then compared against the existing speed, and every such comparison is false for NaN, so the pass declines by construction rather than by a guard."

[[site]]
function = "carve_segment"
parameter = "tool_radius"
status = "safe"
why = "The public entry point is `simulate_toolpath`, which refuses a non-finite or non-positive radius before calling this. Called directly with a NaN radius it carves nothing, which is the same outcome as the refusal it now sits behind."

[[site]]
function = "new"
parameter = "w"
status = "safe"
why = "`Quaternion::new` computes `norm` first and returns IDENTITY when it is zero or non-finite, so the `w < 0.0` sign test only ever sees a finite value."
