# Every public `f64` parameter compared by an ordering operator, and what happens when it is `NaN`.
#
# An ordering comparison is **false** when either side is `NaN`. A guard written as one therefore
# lets `NaN` through silently — and if the guard's `false` branch means "no problem here", the check
# fails *open*. This review found the shape seven times, three of them in safety checks:
#
#   check_dual_robot_clearance          reported `safe = true` on a NaN joint angle
#   detect_anomalies                    reported a healthy printer on a NaN thermistor reading
#   calculate_clearance_velocity_scale  returned NaN instead of slowing down
#   optimize_constant_mrr               wrote NaN and negative feedrates past `depth_of_cut <= 0.0`
#   BrepSolid::slice_to_l1_ops          accepted a NaN Z bound past `z_end < z_start`
#   DexelGrid::new_stock                accepted a NaN bound past `max_x <= min_x`
#   generate_trochoidal_slot            emitted a non-finite coordinate past the width guard
#
# `generate/tpms.rs` and `clothoid.rs` already carried source notes about exactly this class, so it
# had been found and fixed locally twice without ever being generalised. This file is that
# generalisation: `tools/check_nan_guards.py` enumerates the candidates, and every one must be
# accounted for here. A new candidate that is not recorded fails CI; a recorded site the detector no
# longer finds also fails, so the manifest cannot rot.

schema_version = 1

# ---------------------------------------------------------------------------------------------
# guarded — non-finite input is refused or declined before the ordering comparison decides anything
# ---------------------------------------------------------------------------------------------

# `calculate_auto_tuned_pressure_advance`, `corner_blend`, `check_dual_robot_clearance` and the
# thermal reading checks are deliberately NOT listed: each calls `is_finite`/`is_nan` on the parameter
# directly, so the detector no longer proposes them. That is the intended end state — this manifest
# carries only what the detector cannot see for itself.

[[site]]
function = "detect_anomalies"
parameter = "target_nozzle_temp"
status = "guarded"
how = "A non-finite reading *or target* is reported as SENSOR_READING_INVALID (critical) before the deviation tests, which additionally require finite values. A NaN target previously skipped the whole nozzle check: a printer at 250 C against a NaN target reported only its bed anomaly."

[[site]]
function = "detect_anomalies"
parameter = "target_bed_temp"
status = "guarded"
how = "Same guard as target_nozzle_temp above."

