name: deploy-verify

# ADR 0003: services/cloud is the sole public async control plane and
# containers/verify-runner is its private native verifier. Staging deploys on
# merge to main; a version tag promotes the same topology to production.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "services/cloud/**"
      - "containers/verify-runner/**"
      - "crates/core/**"
      - "crates/license/**"
      - ".github/workflows/deploy-verify.yml"
  pull_request:
    paths:
      - "services/cloud/**"
      - "containers/verify-runner/**"
      - "crates/core/**"
      - "crates/license/**"
      - ".github/workflows/deploy-verify.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  # PR validation never deploys and gets its own group. Real staging/production
  # rollouts remain serialized per environment and are never cancelled midway.
  group: deploy-verify-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref_type == 'tag' && 'production' || inputs.environment || 'staging') }}
  cancel-in-progress: false

jobs:
  runner:
    name: native verifier tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: fmt + clippy + test
        working-directory: containers/verify-runner
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo test --locked

  control-plane:
    name: async control plane tests and deployment config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      - name: install
        working-directory: services/cloud
        run: |
          npm ci
          npm audit --audit-level=moderate
      - name: generated types, typecheck and Worker-runtime tests
        working-directory: services/cloud
        run: npm run check
      # Dry-run resolves all bindings and builds the real container image. Named
      # environments do not inherit D1/R2/Queue/Container bindings, so both
      # production and staging must be checked independently.
      - name: validate production and staging deployments
        working-directory: services/cloud
        run: |
          npx wrangler deploy --dry-run --outdir /tmp/dry-cloud-production
          npx wrangler deploy --env staging --dry-run --outdir /tmp/dry-cloud-staging
      # Issue #305. A real deploy never uses the committed Dockerfile image; it
      # uses the config the promotion gate generates. Rendering that config from a
      # placeholder digest and dry-running both environments keeps the generated
      # shape deployable, without needing an account or a published image.
      - name: validate the generated promotion config
        run: |
          for target in production staging; do
            python3 tools/promote_runner_image.py render \
              --environment "$target" \
              --digest "sha256:$(printf '3f%.0s' $(seq 32))" \
              --account-id 0123456789abcdef0123456789abcdef \
              --out-config "services/cloud/wrangler.promotion-${target}.jsonc"
          done
          cd services/cloud
          npx wrangler deploy -c wrangler.promotion-production.jsonc \
            --dry-run --outdir /tmp/dry-cloud-promoted-production
          npx wrangler deploy -c wrangler.promotion-staging.jsonc --env staging \
            --dry-run --outdir /tmp/dry-cloud-promoted-staging

  deploy:
    name: deploy (${{ github.ref_type == 'tag' && 'production' || inputs.environment || 'staging' }})
    needs: [runner, control-plane]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.repository == 'dmytro-yemelianov/dry'
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || inputs.environment || 'staging' }}
    # `packages: read` and `attestations: read` are what let the promotion gate
    # resolve the GHCR digest and verify its signed build provenance.
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      TARGET: ${{ github.ref_type == 'tag' && 'production' || inputs.environment || 'staging' }}
      IMAGE: ghcr.io/${{ github.repository }}-verify-runner
      PROMOTION_CONFIG: wrangler.promotion.jsonc
      EVIDENCE: ${{ github.workspace }}/deployment-evidence.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      # Missing account configuration is a named deployment blocker, not a code
      # failure. Once configured, deployment failures remain hard failures.
      - name: is this environment configured?
        id: configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are absent; skipping deploy. Provisioned binding ids are a separate prerequisite documented in services/cloud/README.md."
          fi
      - name: install
        if: steps.configured.outputs.ready == 'true'
        working-directory: services/cloud
        run: npm ci
      # Issue #305. Nothing is deployed until one immutable digest is resolved for
      # the promoted release and its signed provenance names this repository, this
      # commit and the verify-runner builder workflow. Any mismatch fails closed.
      - name: resolve and verify the runner image digest
        id: promotion
        if: steps.configured.outputs.ready == 'true'
        env:
          # The registry credential is read from the environment; a token passed
          # as an argument would be visible to every process on the runner.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 tools/promote_runner_image.py resolve \
            --repository "${{ github.repository }}" \
            --image "$IMAGE" \
            --environment "$TARGET" \
            --release-ref "${{ github.ref }}" \
            --source-commit "${{ github.sha }}" \
            --account-id "$ACCOUNT_ID" \
            --config services/cloud/wrangler.jsonc \
            --out-config "services/cloud/${PROMOTION_CONFIG}" \
            --evidence "$EVIDENCE" \
            --github-output "$GITHUB_OUTPUT"
      # Cloudflare Containers cannot pull from GHCR, so the verified image is
      # copied into the Cloudflare managed registry under a tag derived from the
      # source digest. Pulling by digest is what keeps the copy honest.
      - name: copy the attested image into the Cloudflare registry
        if: steps.configured.outputs.ready == 'true'
        working-directory: services/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_REFERENCE: ${{ steps.promotion.outputs.source_reference }}
          PROMOTED_IMAGE: ${{ steps.promotion.outputs.promoted_image }}
        run: |
          docker pull --platform linux/amd64 "$SOURCE_REFERENCE"
          docker tag "$SOURCE_REFERENCE" "$PROMOTED_IMAGE"
          npx wrangler containers push "$PROMOTED_IMAGE"
      - name: deploy
        id: deploy
        if: steps.configured.outputs.ready == 'true'
        working-directory: services/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [ "$TARGET" = "production" ]; then
            npx wrangler deploy -c "$PROMOTION_CONFIG" | tee /tmp/deploy.log
          else
            npx wrangler deploy -c "$PROMOTION_CONFIG" --env staging | tee /tmp/deploy.log
          fi
          revision=$(sed -n 's/.*[Vv]ersion ID: *\([0-9a-f-]\{36\}\).*/\1/p' /tmp/deploy.log | tail -1)
          if [ -z "$revision" ]; then
            echo "::error::wrangler did not report a deployed version id"
            exit 1
          fi
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
      # Acceptance criterion: the record names release, source commit, image
      # digest and environment revision, or the promotion is not evidenced.
      - name: close the deployment evidence
        if: steps.configured.outputs.ready == 'true'
        run: |
          python3 tools/promote_runner_image.py finalize \
            --evidence "$EVIDENCE" \
            --revision "${{ steps.deploy.outputs.revision }}"
          {
            echo "### deployment evidence"
            echo
            echo '```json'
            cat "$EVIDENCE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: publish the deployment evidence
        if: steps.configured.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-evidence-${{ github.ref_type == 'tag' && 'production' || inputs.environment || 'staging' }}
          path: deployment-evidence.json
          if-no-files-found: error
      # This proves Worker/control-plane liveness only. A separately authenticated
      # staging job smoke is still required before claiming end-to-end deployment.
      - name: smoke the deployed control plane
        if: steps.configured.outputs.ready == 'true'
        env:
          BASE_URL: ${{ vars.DRY_CLOUD_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::DRY_CLOUD_BASE_URL is required for a configured deployment"
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "${BASE_URL}/healthz" || echo 000)
            if [ "$code" = "200" ]; then
              python3 -c 'import json; p=json.load(open("/tmp/health.json")); assert p == {"ok": True, "service": "dry-cloud-control-plane"}'
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}; retrying"
            sleep 10
          done
          echo "::error::control-plane /healthz did not return its exact contract"
          exit 1
