name: deploy-verify

# ADR 0003: services/cloud is the sole public async control plane and
# containers/verify-runner is its private native verifier. Staging deploys on
# merge to main; a version tag promotes the same topology to production.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "services/cloud/**"
      - "containers/verify-runner/**"
      - "crates/core/**"
      - "crates/license/**"
      - ".github/workflows/deploy-verify.yml"
  pull_request:
    paths:
      - "services/cloud/**"
      - "containers/verify-runner/**"
      - "crates/core/**"
      - "crates/license/**"
      - ".github/workflows/deploy-verify.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  # PR validation never deploys and gets its own group. Real staging/production
  # rollouts remain serialized per environment and are never cancelled midway.
  group: deploy-verify-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref_type == 'tag' && 'production' || inputs.environment || 'staging') }}
  cancel-in-progress: false

jobs:
  runner:
    name: native verifier tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: fmt + clippy + test
        working-directory: containers/verify-runner
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo test --locked

  control-plane:
    name: async control plane tests and deployment config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      - name: install
        working-directory: services/cloud
        run: |
          npm ci
          npm audit --audit-level=moderate
      - name: generated types, typecheck and Worker-runtime tests
        working-directory: services/cloud
        run: npm run check
      # Dry-run resolves all bindings and builds the real container image. Named
      # environments do not inherit D1/R2/Queue/Container bindings, so both
      # production and staging must be checked independently.
      - name: validate production and staging deployments
        working-directory: services/cloud
        run: |
          npx wrangler deploy --dry-run --outdir /tmp/dry-cloud-production
          npx wrangler deploy --env staging --dry-run --outdir /tmp/dry-cloud-staging

  deploy:
    name: deploy (${{ github.ref_type == 'tag' && 'production' || inputs.environment || 'staging' }})
    needs: [runner, control-plane]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.repository == 'dmytro-yemelianov/dry'
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      # Missing account configuration is a named deployment blocker, not a code
      # failure. Once configured, deployment failures remain hard failures.
      - name: is this environment configured?
        id: configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are absent; skipping deploy. Provisioned binding ids are a separate prerequisite documented in services/cloud/README.md."
          fi
      - name: install
        if: steps.configured.outputs.ready == 'true'
        working-directory: services/cloud
        run: npm ci
      - name: deploy
        if: steps.configured.outputs.ready == 'true'
        working-directory: services/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          target="${{ github.ref_type == 'tag' && 'production' || inputs.environment || 'staging' }}"
          if [ "$target" = "production" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --env staging
          fi
      # This proves Worker/control-plane liveness only. A separately authenticated
      # staging job smoke is still required before claiming end-to-end deployment.
      - name: smoke the deployed control plane
        if: steps.configured.outputs.ready == 'true'
        env:
          BASE_URL: ${{ vars.DRY_CLOUD_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::DRY_CLOUD_BASE_URL is required for a configured deployment"
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "${BASE_URL}/healthz" || echo 000)
            if [ "$code" = "200" ]; then
              python3 -c 'import json; p=json.load(open("/tmp/health.json")); assert p == {"ok": True, "service": "dry-cloud-control-plane"}'
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}; retrying"
            sleep 10
          done
          echo "::error::control-plane /healthz did not return its exact contract"
          exit 1
