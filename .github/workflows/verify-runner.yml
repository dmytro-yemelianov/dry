name: verify-runner-ci

# Issue #305: a promotion must be able to name one immutable image digest and
# prove where it came from. Every published image therefore carries signed build
# provenance pushed to the registry alongside it, and version tags publish a
# semver-named image so a release can be promoted by name.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - 'containers/verify-runner/**'
      - 'crates/core/**'
      - 'crates/license/**'
      - '.github/workflows/verify-runner.yml'
  pull_request:
    paths:
      - 'containers/verify-runner/**'
      - 'crates/core/**'
      - 'crates/license/**'
      - '.github/workflows/verify-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit & Integration Tests (Tier 3 Container Runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: Rust format & clippy
        working-directory: containers/verify-runner
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
      - name: Run test suite
        working-directory: containers/verify-runner
        run: cargo test --locked

  docker-build:
    name: Build & Push Container Image
    needs: test
    runs-on: ubuntu-latest
    # `attestations`/`id-token` mint the short-lived signing identity that binds
    # the pushed digest to this workflow, this commit and the public Rekor log.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}-verify-runner
      PUBLISHES: ${{ github.repository == 'dmytro-yemelianov/dry' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        if: env.PUBLISHES == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `type=semver` is what makes a release promotable by its own version:
      # tools/promote_runner_image.py resolves `X.Y.Z` for a `vX.Y.Z` promotion
      # and `sha-<short>` for a staging promotion, then pins the digest behind it.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=DryMachina Verify Runner
            org.opencontainers.image.description=DryMachina toolpath verification service
            org.opencontainers.image.licenses=BUSL-1.1
            org.opencontainers.image.vendor=DryMachina
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: containers/verify-runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISHES == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest build provenance for the pushed digest
        if: env.PUBLISHES == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record the published digest
        if: env.PUBLISHES == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          digest = os.environ["DIGEST"]
          assert digest.startswith("sha256:") and len(digest) == 71, digest
          record = {
              "image": os.environ["IMAGE"],
              "digest": digest,
              "source_commit": os.environ["GITHUB_SHA"],
              "release": os.environ["GITHUB_REF"],
          }
          pathlib.Path("verify-runner-image.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8"
          )
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(f"### verify-runner image\n\n`{record['image']}@{digest}`\n")
          PY
      - name: Publish the digest record
        if: env.PUBLISHES == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-runner-image
          path: verify-runner-image.json
          if-no-files-found: error
