name: verify-runner-ci

on:
  push:
    branches:
      - main
    paths:
      - 'containers/verify-runner/**'
      - 'crates/core/**'
      - 'crates/license/**'
      - '.github/workflows/verify-runner.yml'
  pull_request:
    paths:
      - 'containers/verify-runner/**'
      - 'crates/core/**'
      - 'crates/license/**'
      - '.github/workflows/verify-runner.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: Rust format & clippy
        working-directory: containers/verify-runner
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
      - name: Run test suite
        working-directory: containers/verify-runner
        run: cargo test --locked

  docker-build:
    name: Build & Push Container Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-verify-runner
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/verify-runner/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
