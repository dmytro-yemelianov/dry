name: Documentation & The Dry Book

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'web/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'web/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# There is no deployment to serialise any more (see the note on the removed job below), so a
# superseded docs build is simply cancelled rather than queued behind the one it replaces.
concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: build-docs-and-book
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: 'npm'
          cache-dependency-path: docs/site/package-lock.json

      - name: Install dependencies
        working-directory: docs/site
        run: npm ci

      - name: Build documentation site & The Dry Book
        run: bash docs/site/build.sh public

# There is deliberately no publishing job here. The documentation's public home is the
# `dry-public-docs` Cloudflare Pages project (`docs/18-cloudflare-publishing.md`, `docs/site/
# wrangler.jsonc`), and this workflow's job is to prove the site and The Dry Book still build.
#
# A `deploy-github-pages` job used to follow, publishing a second copy to GitHub Pages. GitHub Pages
# was never enabled on the repository, so it failed with `404 ... Ensure GitHub Pages has been
# enabled` on every run it ever made — 0 successes out of 13 — while the build above passed. That is
# the shape of failure worth avoiding: a red workflow that is permanently red says nothing when it
# breaks for a real reason. Removed rather than gated, because a second public copy of the docs at a
# github.io URL is not wanted; if that changes, enable Pages first and restore the job with it.
