name: CI

on:
  # `pull_request` alone left every branch without an open PR completely unverified — no trigger
  # fired at all (#197). That is not theoretical: 29 commits of hardening work accumulated on one
  # such branch, and the first CI run against them failed four jobs on three independent causes,
  # none subtle, all of which would have been caught within minutes of the commit that introduced
  # them. This repo uses CI as the *only* enforcement point for the docs-site drift gate, the
  # `proofs/` mutation checksums and the wasm/native bit-identity test, so a branch CI never sees is
  # one where those gates are silently unenforced.
  #
  # Trade-off, accepted deliberately: a branch matching these prefixes that *also* has an open PR now
  # runs twice, once per event. Collapsing both into one concurrency group would fix that, but
  # `cancel-in-progress` would then cancel the PR's own checks and show them as failed — worse than
  # the duplicate. Opening a draft PR early avoids the duplicate and is the cheaper habit anyway.
  push:
    branches: [main, "feat/**", "stack/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (fmt + clippy + test, native + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      - name: fmt
        run: cargo fmt --all --check
      # The standing discipline (inherited from the FullControl fork): clippy is -D warnings with NO
      # #[allow] silencing — fix structurally. Enforced on the native AND wasm targets.
      - name: clippy (native, whole workspace)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # wasm targets only the engine crate(s) — dry-core (and, later, the wasm-binding). The native CLI
      # and PyO3 binding are not wasm targets.
      - name: clippy (wasm, dry-core)
        run: cargo clippy -p dry-core --target wasm32-unknown-unknown --locked -- -D warnings
      # `crates/core/tests/wasm_native_math.rs` builds the wasm binding and compares it with native
      # output; that test shells out to `web/build.sh`, which requires wasm-bindgen and Node.
      - name: install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.123 --locked
      - name: test
        run: cargo test --workspace --all-features --locked
      - name: kill bounded feature source mutations
        run: python3 tools/check_feature_mutations.py
      - name: compile the minimal CLI feature set
        run: cargo check -p dry-cli --no-default-features --locked
      - name: build (wasm, dry-core)
        run: cargo build -p dry-core --target wasm32-unknown-unknown --locked

  python-sdk:
    name: python SDK (maturin build + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: verify legal notice sources
        run: |
          cmp NOTICE py/NOTICE
          cmp third_party/licenses/Apache-2.0.txt py/third_party/licenses/Apache-2.0.txt
          cmp third_party/licenses/MIT.txt py/third_party/licenses/MIT.txt
      - name: rust check (the binding)
        working-directory: py
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
      - name: venv + tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet maturin pytest
      - name: build the `dry` module into the venv
        working-directory: py
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: ../.venv/bin/maturin develop --locked
      - name: verify built package legal notices
        working-directory: py
        run: |
          ../.venv/bin/maturin build --release --locked --out ../dist-ci
          ../.venv/bin/maturin sdist --out ../dist-ci
          ../.venv/bin/python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          artifacts = Path("../dist-ci")
          wheel = next(artifacts.glob("*.whl"))
          sdist = next(artifacts.glob("*.tar.gz"))
          required = (
              "NOTICE",
              "third_party/licenses/Apache-2.0.txt",
              "third_party/licenses/MIT.txt",
          )

          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              missing = [name for name in required if not any(item.endswith(f".dist-info/licenses/{name}") for item in names)]
              assert not missing, f"{wheel.name} is missing legal notices: {missing}"

          with tarfile.open(sdist, "r:gz") as archive:
              names = archive.getnames()
              missing = [name for name in required if not any(item.endswith(f"/py/{name}") for item in names)]
              assert not missing, f"{sdist.name} is missing legal notices: {missing}"
          PY
      - name: pytest (the SDK reproduces the oracle, clean-room)
        working-directory: py
        run: ../.venv/bin/pytest tests/ -q

  wasm:
    name: wasm binding (build + node reproduces the oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      # the binding is excluded from the core workspace, so it gets its own fmt + clippy (same
      # -D warnings, no #[allow] discipline as the core).
      - name: rust check (the wasm binding)
        working-directory: crates/wasm
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Blockly/web static regressions
        run: node web/blocks-regression.mjs
      # pin must match the wasm-bindgen crate version (=0.2.123) — the .wasm and JS glue must agree.
      - name: install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.123 --locked
      - name: build the node-target engine
        run: bash web/build.sh nodejs web/pkg-node
      - name: node reproduces the oracle byte-for-byte
        run: node web/smoke.cjs web/pkg-node conformance/gcode conformance/simulate

  ts-sdk:
    name: TypeScript SDK (build + reproduces the oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      # pin must match the wasm-bindgen crate version (=0.2.123) — the .wasm and JS glue must agree.
      - name: install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.123 --locked
      - name: install + build (wasm engine -> SDK)
        working-directory: sdk/ts
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: test (the SDK reproduces the oracle, clean-room)
        working-directory: sdk/ts
        run: npm test

  docs-site:
    name: docs site (typecheck + unit + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      # pin must match the wasm-bindgen crate version (=0.2.123) — the .wasm and JS glue must agree.
      - name: install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.123 --locked
      - name: build the Node SDK oracle
        working-directory: sdk/ts
        run: |
          npm ci
          npm run build
      - name: install docs-site deps
        working-directory: docs/site
        run: |
          npm ci
          npm audit --audit-level=high
      - name: reference docs
        working-directory: docs/site
        run: |
          npm run reference
          git -C ../.. diff --exit-code docs/site/reference/generated
          git -C ../.. diff --exit-code docs/site/public/reference/previews
      - name: type-check examples
        working-directory: docs/site
        run: npm run typecheck
      - name: unit tests
        working-directory: docs/site
        run: |
          bash build.sh wasm-only
          npm run test
      - name: build docs-only boundary
        working-directory: docs/site
        run: npm run build:docs-only
      - name: build public interactive product site
        working-directory: docs/site
        run: npm run build
      - name: smoke public interactive product examples
        working-directory: docs/site
        run: |
          npx playwright install chromium
          npm run smoke

  spec-vectors:
    name: spec vectors (independent python validator, no dry-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: install validator deps (jsonschema only; the codec is pure stdlib)
        run: pip install -r tools/requirements.txt
      # A second, dry-core-free implementation of the DRY0/DRY1 + JSON codecs re-decodes, re-encodes and
      # round-trips every published vector and checks the MANIFEST hashes (docs/10-dry-ir-v0-spec.md).
      # The Rust side (drift gate: committed goldens still match the engine) rides `cargo test --all` in
      # the `core` job above.
      - name: validate public conformance vectors
        run: python tools/validate_vectors.py conformance/vectors
      # A second dry-core-free check: every golden report (verify/review/trace), every example
      # profile and every labelled TPMS option bundle validates against the published schemas
      # (docs/11-profiles-and-reports.md, docs/07-tpms-codegen.md). The Rust side (report drift gate,
      # rule-catalog coverage, and the engine column of the TPMS corpus in
      # `crates/core/tests/tpms_options_schema.rs`) rides `cargo test --all` in the `core` job.
      - name: validate report schemas + example profiles + TPMS options
        run: python tools/validate_reports.py .

  formal-assurance:
    name: formal assurance (claims + Lean proofs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: install claim-validator dependencies
        run: pip install -r tools/requirements.txt
      - name: validate proof claims and numeric-boundary inventory
        run: |
          python tools/validate_proof_claims.py
          python tools/validate_spec_claim_links.py
          python tools/validate_numeric_boundaries.py
          python tools/validate_numeric_boundaries.py proofs/verify-numeric-boundaries-v0.toml
          python tools/validate_numeric_boundaries.py proofs/emit-numeric-boundaries-v0.toml
          python tools/validate_numeric_boundaries.py proofs/resolve-clothoid-numeric-boundaries-v0.toml
          python -m unittest discover -s tools/tests -p 'test_validate_proof_claims.py'
          python -m unittest discover -s tools/tests -p 'test_validate_numeric_boundaries.py'
          python -m unittest discover -s tools/tests -p 'test_validate_spec_claim_links.py'
          python -m unittest discover -s tools/tests -p 'test_generate_assurance_report.py'
          python tools/generate_assurance_report.py --check
      - name: build checked proofs with the pinned Lean/Mathlib toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          build-args: "--wfail"
          test: false
          lint: false
          use-mathlib-cache: true
      - name: check executable Lean proof fixtures
        run: python tools/check_proof_fixtures.py
      - name: check scoped Rust refinement mutations
        run: |
          python tools/check_resolve_orientation_mutations.py
          python tools/check_resolve_channels_mutations.py
          python tools/check_feature_mutations.py

  bench:
    name: benches (compile gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
      # Keep the criterion benchmarks compiling against the current API (docs/13-performance-and-scale.md).
      # The deterministic bounded-memory scale gate (tests/memory_scale.rs) runs in the `core` job's
      # `cargo test --all`; wall-clock benchmarks are local-profiling only, not a CI pass/fail.
      - name: compile benches
        run: cargo bench -p dry-core --no-run --locked

  cloud:
    name: cloud (workers-rs wasm32 build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # excluded from the core workspace (own Cargo.lock, own empty [workspace] root, same pattern
      # as crates/wasm), so it gets its own fmt + clippy (same -D warnings, no #[allow] discipline).
      - name: rust check (the cloud worker)
        working-directory: crates/cloud
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings
      # `worker-build` (the packaging step `wrangler deploy` would run) needs a wasm-bindgen build
      # that isn't reliably reproducible in CI today (externref/reference-types mismatches against
      # pinned wasm-bindgen releases); a plain `cargo build` for the wasm32 target still catches any
      # compile break against dry-core without depending on that packaging step.
      - name: build (wasm32, dry-cloud)
        working-directory: crates/cloud
        run: cargo build --target wasm32-unknown-unknown --locked

  verify-runner:
    name: verify-runner (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      # excluded from the core workspace (own Cargo.lock, own empty [workspace] root, builds
      # standalone or via Docker — see containers/verify-runner/Dockerfile), so it gets its own
      # fmt + clippy (same -D warnings, no #[allow] discipline) and its own test run.
      - name: rust check (the verify runner)
        working-directory: containers/verify-runner
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
      - name: test
        working-directory: containers/verify-runner
        run: cargo test --locked

  linuxcnc:
    name: linuxcnc (reference interpreter accepts the CNC goldens)
    runs-on: ubuntu-latest
    # Debian ships linuxcnc-uspace (1:2.9.4-2+deb13u1 in trixie) as a stock package;
    # Ubuntu does not carry it at all, so the job runs in a Debian container rather
    # than adding the upstream apt source to the runner. No VM is involved — the Lima
    # guest in tools/linuxcnc.lima.yaml exists only for running this check on macOS.
    container: debian:trixie
    steps:
      - name: install the reference interpreter
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates linuxcnc-uspace
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # This is the only independent oracle in the repo: every other gate is Dry
      # checking Dry (its own parser, its own frozen goldens). rs274 re-reads the
      # emitted program and emits canonical machine ops, so a file passes only if
      # LinuxCNC agrees it describes real motion.
      - name: rs274 accepts the emitted CNC programs
        run: tools/linuxcnc_check.sh

  security:
    name: dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
      - name: Rust advisory database
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo audit

  # conformance corpora are generated by the FullControl ORACLE (golden / byte-identity / gallery /
  # profiles / round-trip) and committed; CI checks Dry against them (no FullControl dependency in CI).
  # The runner is generalised in P0.5 — see docs/03-conformance.md.
