name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (fmt + clippy + test, native + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: fmt
        run: cargo fmt --all --check
      # The standing discipline (inherited from the FullControl fork): clippy is -D warnings with NO
      # #[allow] silencing — fix structurally. Enforced on the native AND wasm targets.
      - name: clippy (native, whole workspace)
        run: cargo clippy --all-targets -- -D warnings
      # wasm targets only the engine crate(s) — dry-core (and, later, the wasm-binding). The native CLI
      # and PyO3 binding are not wasm targets.
      - name: clippy (wasm, dry-core)
        run: cargo clippy -p dry-core --target wasm32-unknown-unknown -- -D warnings
      - name: test
        run: cargo test --all
      - name: build (wasm, dry-core)
        run: cargo build -p dry-core --target wasm32-unknown-unknown

  python-sdk:
    name: python SDK (maturin build + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: rust check (the binding)
        working-directory: py
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
      - name: venv + tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet maturin pytest
      - name: build the `dry` module into the venv
        working-directory: py
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: ../.venv/bin/maturin develop
      - name: pytest (the SDK reproduces the oracle, clean-room)
        working-directory: py
        run: ../.venv/bin/pytest tests/ -q

  # conformance corpora are generated by the FullControl ORACLE (golden / byte-identity / gallery /
  # profiles / round-trip) and committed; CI checks Dry against them (no FullControl dependency in CI).
  # The runner is generalised in P0.5 — see docs/03-conformance.md.
