name: Release

# Tag a release with `vX.Y.Z` (matching the workspace/py/ts versions — see docs/12-releasing.md).
# This builds installable artifacts for every front-end, attaches them to the GitHub Release with
# checksums, and keeps registry publishing separate. npm, PyPI, and crates.io publishing is
# intentionally absent; release downloads are public through this repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: "0.2.123"

jobs:
  guard:
    name: guard (provenance + versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: require a release commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: version/tag consistency
        run: bash scripts/check-version.sh "${GITHUB_REF_NAME}"

  quality:
    name: release quality gate
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: install test tooling
        run: |
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
          cargo install cargo-audit --version 0.22.1 --locked
          pip install -r tools/requirements.txt
      - name: Rust quality and conformance
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          python tools/validate_vectors.py conformance/vectors
          python tools/validate_reports.py .
      - name: dependency audits
        run: |
          cargo audit
          npm --prefix sdk/ts ci
          npm --prefix sdk/ts audit --audit-level=high
          npm --prefix docs/site ci
          npm --prefix docs/site audit --audit-level=high

  cli:
    name: cli (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Intel-mac binary is cross-compiled on the Apple-Silicon runner (the Apple SDK supports both
          # arches), avoiding the deprecated/queue-limited macos-13 Intel runner.
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release -p dry-cli --features moonraker --target ${{ matrix.target }} --locked
      - name: smoke the packaged binary
        if: ${{ matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64' }}
        shell: bash
        run: |
          bin="dry"
          [ "${{ runner.os }}" = "Windows" ] && bin="dry.exe"
          "target/${{ matrix.target }}/release/$bin" --version
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          bin="dry"
          [ "${{ runner.os }}" = "Windows" ] && bin="dry.exe"
          stage="dry-${ver}-${{ matrix.target }}"
          mkdir -p "dist/$stage/third_party/licenses"
          cp "target/${{ matrix.target }}/release/$bin" "dist/$stage/"
          cp README.md LICENSE NOTICE "dist/$stage/"
          cp third_party/licenses/*.txt "dist/$stage/third_party/licenses/"
          tar -C dist -czf "dist/${stage}.tar.gz" "$stage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*.tar.gz

  wheels:
    name: wheels (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: build wheels
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          working-directory: py
          command: build
          args: --release --locked --out ../dist-wheels
          manylinux: ${{ matrix.os == 'ubuntu-latest' && 'auto' || '' }}
      # `-o pythonpath=` clears `py/pyproject.toml`'s `pythonpath = ["python"]`, which is there for
      # local development and puts the *source* package ahead of the installed one. That shadowed the
      # wheel with a `dry/` that has no compiled `_native`, so every test errored at collection with
      # "cannot import name '_native' from partially initialized module 'dry'" — and every release
      # since v0.6.0 failed here. This step exists to test the built wheel, so it must import the
      # built wheel; the assertion below now proves which one it got.
      - name: smoke the wheel
        shell: bash
        run: |
          python -m pip install dist-wheels/*.whl pytest
          python -c "
          import dry, pathlib
          assert dry.__package__ == 'dry'
          where = pathlib.Path(dry.__file__).resolve()
          assert 'site-packages' in where.parts, f'imported the source tree, not the wheel: {where}'
          print(f'smoking the installed wheel at {where}')
          "
          python -m pytest py/tests -q -o pythonpath=
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist-wheels/*

  sdist:
    name: sdist (python)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: build sdist
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          working-directory: py
          command: sdist
          args: --out ../dist-wheels
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist-wheels/*

  ts:
    name: ts (npm package)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      - name: install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: build + pack
        working-directory: sdk/ts
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npm test
          mkdir -p ../../dist-npm
          npm pack --pack-destination ../../dist-npm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm
          path: dist-npm/*.tgz

  mcp:
    name: mcp (npm package)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      - name: build + pack MCP server
        working-directory: sdk/mcp
        run: |
          npm ci
          npm run build
          mkdir -p ../../dist-mcp
          npm pack --pack-destination ../../dist-mcp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp
          path: dist-mcp/*.tgz

  wasm:
    name: wasm (standalone web bundle)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - name: install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: build standalone wasm package
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          bash web/build.sh web pkg-dist
          mkdir -p "dist-wasm/dry-wasm-${ver}"
          cp pkg-dist/* "dist-wasm/dry-wasm-${ver}/"
          cp LICENSE NOTICE "dist-wasm/dry-wasm-${ver}/"
          tar -C dist-wasm -czf "dist-wasm/dry-wasm-${ver}.tar.gz" "dry-wasm-${ver}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm
          path: dist-wasm/*.tar.gz

  book:
    name: book (the dry book & architecture specs)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: package the dry book & specs
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p "dist-book/dry-book-${ver}"
          cp -r docs/book/* "dist-book/dry-book-${ver}/"
          mkdir -p "dist-book/dry-book-${ver}/specifications"
          cp docs/0*.md docs/1*.md docs/2*.md "dist-book/dry-book-${ver}/specifications/"
          cp LICENSE NOTICE "dist-book/dry-book-${ver}/"
          tar -C dist-book -czf "dist-book/dry-book-${ver}.tar.gz" "dry-book-${ver}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: book
          path: dist-book/*.tar.gz

  release:
    name: github release
    needs: [cli, wheels, sdist, ts, mcp, wasm, book]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance attestation is signed with a short-lived OIDC identity and recorded in the public
      # Rekor transparency log; `id-token` mints that identity and `attestations` writes the result.
      # Neither grants access to anything else, and no long-lived signing key exists to leak.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: collect assets + checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.whl' -o -name '*.tgz' -o -name '*.zip' \) -exec cp -n {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS
          echo "--- release assets ---"; ls -l
      # An SBOM per release, in CycloneDX, from the committed lockfiles. Generated from
      # `Cargo.lock`/`package-lock.json` rather than by scanning the built binaries, so it describes
      # exactly the dependency set the `--locked` builds above resolved.
      - name: install SBOM tooling
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: generate SBOM
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --all --spec-version 1.5
          # One document for the whole release rather than one per crate: a consumer verifying a
          # downloaded tarball wants the artifact's dependency set, not the workspace's topology.
          python3 - <<'PY_SBOM'
          import json, pathlib
          # Exclude build output: cargo-cyclonedx writes beside each Cargo.toml, but a stale
          # document under target/ would silently join the merge.
          docs = sorted(
              p for p in pathlib.Path(".").rglob("*.cdx.json") if "target" not in p.parts
          )
          if not docs:
              raise SystemExit("cargo-cyclonedx produced no documents")
          merged, seen = None, set()
          for d in docs:
              doc = json.loads(d.read_text())
              if merged is None:
                  merged = doc
                  merged["components"] = []
              for c in doc.get("components", []):
                  key = (c.get("name"), c.get("version"))
                  if key not in seen:
                      seen.add(key)
                      merged["components"].append(c)
          merged["components"].sort(key=lambda c: (c.get("name") or "", c.get("version") or ""))
          pathlib.Path("dist/SBOM.cdx.json").write_text(json.dumps(merged, indent=2) + "\n")
          print(f"merged {len(docs)} document(s), {len(merged['components'])} unique components")
          PY_SBOM
          cd dist && sha256sum SBOM.cdx.json >> SHA256SUMS

      # Signed, verifiable provenance for every published asset. `SHA256SUMS` alone says the files
      # match a list this same workflow wrote; an attestation says *which workflow, at which commit,
      # from which repository* produced them, and a consumer can check that without trusting the
      # release page. Closes part of D6 in docs/23-deployment-roadmap.md.
      - name: attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v2
        with:
          subject-path: dist/*

      - name: create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
