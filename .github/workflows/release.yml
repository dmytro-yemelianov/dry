name: Release

# Tag a release with `vX.Y.Z` (matching the workspace/py/ts versions — see docs/12-releasing.md).
# This builds installable artifacts for every front-end, attaches them to the GitHub Release with
# checksums, and keeps distribution inside this repository's private GitHub Releases. Public npm
# and PyPI publishing is intentionally absent because the artifacts contain proprietary IP.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: "0.2.123"

jobs:
  guard:
    name: guard (release provenance + versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: require a release commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: version/tag consistency
        run: bash scripts/check-version.sh "${GITHUB_REF_NAME}"

  quality:
    name: release quality gate
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.87.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: install test tooling
        run: |
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
          cargo install cargo-audit --version 0.22.1 --locked
          pip install -r tools/requirements.txt
      - name: Rust quality and conformance
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          python tools/validate_vectors.py conformance/vectors
          python tools/validate_reports.py .
      - name: dependency audits
        run: |
          cargo audit
          npm --prefix sdk/ts ci
          npm --prefix sdk/ts audit --audit-level=high
          npm --prefix docs/site ci
          npm --prefix docs/site audit --audit-level=high

  cli:
    name: cli (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Intel-mac binary is cross-compiled on the Apple-Silicon runner (the Apple SDK supports both
          # arches), avoiding the deprecated/queue-limited macos-13 Intel runner.
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.87.0"
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release -p dry-cli --features moonraker --target ${{ matrix.target }} --locked
      - name: smoke the packaged binary
        if: ${{ matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64' }}
        shell: bash
        run: |
          bin="dry"
          [ "${{ runner.os }}" = "Windows" ] && bin="dry.exe"
          "target/${{ matrix.target }}/release/$bin" --version
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          bin="dry"
          [ "${{ runner.os }}" = "Windows" ] && bin="dry.exe"
          stage="dry-${ver}-${{ matrix.target }}"
          mkdir -p "dist/$stage"
          cp "target/${{ matrix.target }}/release/$bin" "dist/$stage/"
          cp README.md LICENSE "dist/$stage/"
          tar -C dist -czf "dist/${stage}.tar.gz" "$stage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*.tar.gz

  wheels:
    name: wheels (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: py
          command: build
          args: --release --locked --out ../dist-wheels
          manylinux: ${{ matrix.os == 'ubuntu-latest' && 'auto' || '' }}
      - name: smoke the wheel
        shell: bash
        run: |
          python -m pip install dist-wheels/*.whl pytest
          python -c "import dry; assert dry.__package__ == 'dry'"
          python -m pytest py/tests -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist-wheels/*

  sdist:
    name: sdist (python)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: py
          command: sdist
          args: --locked --out ../dist-wheels
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist-wheels/*

  ts:
    name: ts (npm package)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.87.0"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
      - name: install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked
      - name: build + pack
        working-directory: sdk/ts
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npm test
          mkdir -p ../../dist-npm
          npm pack --pack-destination ../../dist-npm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm
          path: dist-npm/*.tgz

  release:
    name: github release
    needs: [cli, wheels, sdist, ts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: collect assets + checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.whl' -o -name '*.tgz' -o -name '*.zip' \) -exec cp -n {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS
          echo "--- release assets ---"; ls -l
      - name: create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  pypi:
    name: publish to PyPI (gated on PYPI_API_TOKEN secret)
    needs: [release]
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: collect dists
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp -n {} dist/ \;
      - name: publish
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}

  npm:
    name: publish to npm (gated on NPM_TOKEN secret)
    needs: [release]
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          registry-url: "https://registry.npmjs.org"
      - name: publish
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist/*.tgz --access public --provenance
