version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /py
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /crates/wasm
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /crates/cloud
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /containers/verify-runner
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /sdk/ts
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /sdk/mcp
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /docs/site
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /services/cloud
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /tools/license-issuer
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
