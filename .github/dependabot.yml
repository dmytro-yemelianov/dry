version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /py
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /crates/wasm
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /sdk/ts
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /docs/site
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
