[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/llm", "crates/moonraker"]
default-members = ["crates/core", "crates/cli"]
# `py/` (PyO3) and `crates/wasm` (wasm-bindgen) are bindings excluded from the core workspace so the
# engine stays binding-free; each is built + tested by its own CI job. The TS SDK lands in P4.
exclude = ["py", "crates/wasm"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/dmytro-yemelianov/dry"

[profile.release]
lto = true
codegen-units = 1
