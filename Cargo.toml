[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]
# `py/` (the PyO3 binding) is a maturin project, excluded from the core workspace so the engine stays
# Python-free; it is built + tested by its own CI job. crates/wasm + the TS SDK land in later phases.
exclude = ["py"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dmytro-yemelianov/dry"

[profile.release]
lto = true
codegen-units = 1
