schema_version = 1
model = "resolve-orientation-source-mutations-v0"
source = "crates/core/src/resolve.rs"
# Re-pinned 2026-08-26: the orientation magnitude guard now also refuses a magnitude that
# overflows to infinity, which `mag <= 0.0` let through and which normalises to exactly
# (0, 0, 0) downstream. The mutation below is re-pointed at the widened condition so it still
# removes the whole guard.
source_sha256 = "58b7c5918e81f81bb5551b94539cf2c4c6c4644904392460ef56a33fd6c2a7df"
test = "crates/core/tests/resolve_orientation_refinement.rs"

[[mutation]]
id = "orient-zero-magnitude-accepted"
witness = "zero-orient-before-motion"
description = "Accept zero-magnitude orientation vector during resolution."
old = "if !mag.is_finite() || mag <= 0.0 {"
new = "if false {"

[[mutation]]
id = "orient-does-not-propagate"
witness = "orient-then-two-moves"
description = "Ignore orientation changes during state resolution."
old = "Op::Orient { i, j, k } => orientation = Some([i, j, k]),"
new = "Op::Orient { .. } => {}"

[[mutation]]
id = "orient-resets-on-move"
witness = "orient-then-two-moves"
description = "Reset orientation state to None when Orient op is encountered."
old = "Op::Orient { i, j, k } => orientation = Some([i, j, k]),"
new = "Op::Orient { .. } => orientation = None,"
