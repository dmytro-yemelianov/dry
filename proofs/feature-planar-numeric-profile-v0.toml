schema_version = 1
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0"
model = "feature-planar-binary64-v0"
status = "provisional"
contract = "assurance-precondition-only"
rust_toolchain = "1.88.0"
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[libm]
crate = "libm"
version = "0.2.16"
checksum = "b6d2cec3eae94f9f509c767b45932f1ada8350c4bdb85af2fcab4a3c14807981"

[[limit]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.LIMIT.LOCAL_COORDINATE_MM"
quantity = "Absolute value of a local Move, Arc endpoint or Spline coordinate"
lower = -1048576.0
upper = 1048576.0
unit = "mm"
enforcement = "assumption"
rationale = "The symmetric 2^20 mm envelope is exactly representable in binary64 and deliberately wider than practical machine travel; it is a proof precondition, not a language validity limit."
boundary_ids = [
  "FM1.F64.FEATURE.COORDINATE.INHERIT",
  "FM1.F64.FEATURE.APPLY.POINT"
]

[[limit]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.LIMIT.POSE_TRANSLATION_MM"
quantity = "Absolute value of each FeaturePose translation component"
lower = -1048576.0
upper = 1048576.0
unit = "mm"
enforcement = "assumption"
rationale = "The symmetric 2^20 mm envelope is proof-friendly and does not redefine the current finite-f64 acceptance contract."
boundary_ids = [
  "FM1.F64.FEATURE.POSE.FINITE",
  "FM1.F64.FEATURE.COMPOSE.TRANSLATION",
  "FM1.F64.FEATURE.APPLY.POINT",
  "FM1.F64.FEATURE.APPLY.ARC.CENTER"
]

[[limit]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.LIMIT.POSE_ROTATION_DEG"
quantity = "FeaturePose.rotate_z_deg before degree-to-radian conversion"
lower = -360.0
upper = 360.0
unit = "degree"
enforcement = "assumption"
rationale = "One signed revolution bounds libm argument reduction while preserving every planar orientation modulo a future normalization theorem."
boundary_ids = [
  "FM1.F64.FEATURE.POSE.FINITE",
  "FM1.F64.FEATURE.ANGLE.DEGREES",
  "FM1.F64.FEATURE.TRIG.LIBM"
]

[[limit]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.LIMIT.ARC_CENTER_MM"
quantity = "Absolute value of each local Arc centre component"
lower = -1048576.0
upper = 1048576.0
unit = "mm"
enforcement = "assumption"
rationale = "Arc centres pass a runtime finiteness gate; this proof-only limit additionally bounds finite magnitude."
boundary_ids = [
  "FM1.F64.FEATURE.APPLY.ARC.CENTER",
  "FM1.F64.FEATURE.ARC.CENTER.FINITE"
]

[[limit]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.LIMIT.ORIENTATION_COMPONENT"
quantity = "Each local tool-orientation vector component"
lower = -1.0
upper = 1.0
unit = "dimensionless"
enforcement = "assumption"
rationale = "Orientation components pass a runtime finiteness gate; nonzero/unit validation and normalization remain separate semantic obligations."
boundary_ids = [
  "FM1.F64.FEATURE.APPLY.ORIENTATION",
  "FM1.F64.FEATURE.ORIENTATION.FINITE"
]

[[limit]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.LIMIT.TRANSFORM_COMPOSITIONS"
quantity = "Maximum transform compositions on one accepted default-limit expansion path"
lower = 0
upper = 100000
unit = "count"
enforcement = "assumption"
rationale = "The ceiling matches DEFAULT_MAX_EXPANDED_NODES and safely covers used plus final unused repeat-step composition; custom ExpandLimits require a separately instantiated profile."
boundary_ids = [
  "FM1.F64.FEATURE.COMPOSE.ROTATION",
  "FM1.F64.FEATURE.COMPOSE.TRANSLATION",
  "FM1.F64.FEATURE.MANUAL.IDENTITY"
]

[[limit]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.LIMIT.LOCAL_MULTIPLY_EXACT_RESULT"
quantity = "Absolute value of an exact-real multiplication result before one profiled binary64 rounding step"
lower = -1048576.0
upper = 1048576.0
unit = "result-value"
enforcement = "assumption"
rationale = "The symmetric 2^20 result envelope supports a conservative 2^-32 absolute binary64 multiplication-rounding ceiling, including gradual underflow."
boundary_ids = [
  "FM1.F64.FEATURE.COMPOSE.ROTATION",
  "FM1.F64.FEATURE.COMPOSE.TRANSLATION",
  "FM1.F64.FEATURE.APPLY.POINT",
  "FM1.F64.FEATURE.APPLY.ARC.CENTER",
  "FM1.F64.FEATURE.APPLY.ORIENTATION"
]

[[limit]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.LIMIT.LOCAL_ADD_SUB_EXACT_RESULT"
quantity = "Absolute value of an exact-real addition or subtraction result before one profiled binary64 rounding step"
lower = -4194304.0
upper = 4194304.0
unit = "result-value"
enforcement = "assumption"
rationale = "The symmetric 2^22 result envelope supports a conservative 2^-30 absolute binary64 addition/subtraction-rounding ceiling, including gradual underflow."
boundary_ids = [
  "FM1.F64.FEATURE.COMPOSE.ROTATION",
  "FM1.F64.FEATURE.COMPOSE.TRANSLATION",
  "FM1.F64.FEATURE.APPLY.POINT",
  "FM1.F64.FEATURE.APPLY.ARC.CENTER",
  "FM1.F64.FEATURE.APPLY.ORIENTATION"
]

[[limit]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.LIMIT.RADIAN_INTERMEDIATE"
quantity = "Binary64 radian intermediate passed from FeaturePose conversion to libm"
lower = -7.0
upper = 7.0
unit = "radian"
enforcement = "assumption"
rationale = "The checked degree-conversion theorem proves the intermediate lies strictly inside this envelope whenever rotate_z_deg is within the profiled signed-revolution limit."
boundary_ids = [
  "FM1.F64.FEATURE.ANGLE.DEGREES",
  "FM1.F64.FEATURE.TRIG.LIBM"
]

[[budget]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.BUDGET.COORDINATE_INHERIT_BIT_ERROR"
metric = "Binary64 bit-pattern difference after Option-based coordinate inheritance"
unit = "bit-difference"
status = "bounded"
ceiling = 0.0
rationale = "inherit_point selects and copies a finite f64 without arithmetic."
evidence = [
  "formal/Dry/Semantics/CheckedExpansion.lean",
  "proofs/fixtures/feature-refinement-v0.json",
  "crates/core/tests/feature_refinement.rs"
]
next_obligation = "Keep the zero-error result synchronized with any future coordinate representation."
boundary_ids = ["FM1.F64.FEATURE.COORDINATE.INHERIT"]

[[budget]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.BUDGET.ANGLE_RAD_ABS_ERROR"
metric = "Absolute error between exact degrees*pi/180 and the binary64 radian intermediate"
unit = "radian"
status = "bounded"
ceiling = 1.4210854715202004e-14
rationale = "The checked operation-order proof uses Rust's exact binary64 PI rational, Mathlib's real-pi bounds and the scoped gradual-underflow-aware rounding contract to establish a conservative 2^-46 radian ceiling over [-360, 360] degrees."
evidence = [
  "formal/Dry/Numeric/Angle.lean",
  "formal/Dry/Numeric/Binary64.lean"
]
next_obligation = "Refine native/wasm Rust execution to the rounding premise and use the resulting [-7, 7] argument interval for the pinned libm bound."
boundary_ids = ["FM1.F64.FEATURE.ANGLE.DEGREES"]

[[budget]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.BUDGET.TRIG_COEFFICIENT_ABS_ERROR"
metric = "Maximum absolute error of libm sine or cosine against exact real trigonometry"
unit = "dimensionless"
status = "pending"
rationale = "Native/wasm agreement does not establish accuracy against real sine or cosine."
evidence = []
next_obligation = "Import or check a libm 0.2.16 error contract over the profiled radian interval."
boundary_ids = ["FM1.F64.FEATURE.TRIG.LIBM"]

[[budget]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.BUDGET.COMPOSE_ROTATION_COMPONENT_ABS_ERROR"
metric = "Local binary64 operation error of either composed rotation coefficient against the exact-real expression over the same represented inputs"
unit = "dimensionless"
status = "bounded"
ceiling = 1.862645149230957e-9
rationale = "The checked one-step formula is at most 2^-29 when each multiplication result is within 2^20 and each addition/subtraction result is within 2^22 under the scoped binary64 rounding contract."
evidence = [
  "formal/Dry/Numeric/RoundModel.lean",
  "formal/Dry/Numeric/Binary64.lean"
]
next_obligation = "Add coefficient-construction error and derive accumulated drift up to the profiled composition ceiling; keep the complete boundary pending until then."
boundary_ids = ["FM1.F64.FEATURE.COMPOSE.ROTATION"]

[[budget]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.BUDGET.COMPOSE_TRANSLATION_COMPONENT_ABS_ERROR_MM"
metric = "Local binary64 operation error of each composed translation component against the exact-real expression over the same represented inputs"
unit = "mm"
status = "bounded"
ceiling = 3.725290298461914e-9
rationale = "The checked one-step XY formula is at most 2^-28 and its Z formula is at most 2^-30 under the scoped operation-result limits and binary64 rounding contract."
evidence = [
  "formal/Dry/Numeric/RoundModel.lean",
  "formal/Dry/Numeric/Binary64.lean"
]
next_obligation = "Compose this local-operation bound with input/coefficient error and repeated translation growth; keep the complete boundary pending until then."
boundary_ids = ["FM1.F64.FEATURE.COMPOSE.TRANSLATION"]

[[budget]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.BUDGET.POINT_COMPONENT_ABS_ERROR_MM"
metric = "Local binary64 operation error of each transformed Move, Arc-end or Spline component against the exact-real expression over the same represented inputs"
unit = "mm"
status = "bounded"
ceiling = 3.725290298461914e-9
rationale = "The checked XY formula is at most 2^-28 and its Z formula is at most 2^-30 under the scoped operation-result limits and binary64 rounding contract."
evidence = [
  "formal/Dry/Numeric/RoundModel.lean",
  "formal/Dry/Numeric/Binary64.lean"
]
next_obligation = "Add transform coefficient/construction error and independently refine Rust native/wasm executions against exported intervals."
boundary_ids = ["FM1.F64.FEATURE.APPLY.POINT"]

[[budget]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.BUDGET.ARC_CENTER_COMPONENT_ABS_ERROR_MM"
metric = "Local binary64 operation error of each transformed Arc-centre component against the exact-real expression over the same represented inputs"
unit = "mm"
status = "bounded"
ceiling = 3.725290298461914e-9
rationale = "Arc-centre XY uses the checked point graph and is at most 2^-28 under the scoped operation-result limits and binary64 rounding contract."
evidence = [
  "formal/Dry/Numeric/RoundModel.lean",
  "formal/Dry/Numeric/Binary64.lean"
]
next_obligation = "Add transform coefficient/construction error and independently refine Rust native/wasm apply_xy results against exported intervals."
boundary_ids = [
  "FM1.F64.FEATURE.APPLY.ARC.CENTER",
  "FM1.F64.FEATURE.ARC.CENTER.FINITE"
]

[[budget]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.BUDGET.ORIENTATION_COMPONENT_ABS_ERROR"
metric = "Local binary64 operation error of each transformed orientation-vector component against the exact-real expression over the same represented inputs"
unit = "dimensionless"
status = "bounded"
ceiling = 1.862645149230957e-9
rationale = "The checked XY vector formula is at most 2^-29 and Z is copied exactly under the scoped operation-result limits and binary64 rounding contract."
evidence = [
  "formal/Dry/Numeric/RoundModel.lean",
  "formal/Dry/Numeric/Binary64.lean"
]
next_obligation = "Land nonzero/unit validation, add coefficient-construction error and derive an angular error bound."
boundary_ids = [
  "FM1.F64.FEATURE.APPLY.ORIENTATION",
  "FM1.F64.FEATURE.ORIENTATION.FINITE"
]

[[budget]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.BUDGET.MANUAL_IDENTITY_COMPONENT_THRESHOLD"
metric = "Maximum absolute component deviation accepted by Transform::is_identity"
unit = "component-value"
status = "policy"
ceiling = 1e-12
rationale = "This records the existing code threshold without claiming it is a proved geometry error budget."
evidence = ["crates/core/src/features.rs"]
next_obligation = "Replace policy status with a proved observation bound or reject every non-bit-identity transform for manual code."
boundary_ids = ["FM1.F64.FEATURE.MANUAL.IDENTITY"]

[[budget]]
id = "FM1.NUMERIC.PROFILE.FEATURE.PLANAR.V0.BUDGET.PASSTHROUGH_BIT_ERROR"
metric = "Binary64 bit-pattern difference across cloned non-geometric Op payloads"
unit = "bit-difference"
status = "bounded"
ceiling = 0.0
rationale = "The feature pass clones these payloads and performs no numeric operation."
evidence = ["crates/core/src/features.rs"]
next_obligation = "Keep the zero-error pass-through classification synchronized with the pinned Op enum."
boundary_ids = ["FM1.F64.FEATURE.OP.PASSTHROUGH"]
