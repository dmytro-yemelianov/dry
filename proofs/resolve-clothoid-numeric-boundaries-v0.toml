# ---------------------------------------------------------------------------------------------
# Three boundaries, and the reason they are three rather than one.
#
# The node's numerics split cleanly by *what can go wrong*. The series is an approximation with an
# error (bounded, measured against something outside Dry). The corner solve is a set of exact
# rejections with no epsilon at all — every one of them is a comparison against zero or against a
# supplied length — and its failure mode is a refusal, not a wrong number. The sampling is a
# deterministic discretisation whose error is geometric and scales with the blend, and it is the only
# one of the three a user can see in the emitted program.
#
# This is a separate inventory from `feature-numeric-boundaries-v0` even though that one pins
# `resolve.rs` too: that model is scoped to `features.rs` and pins the `Op` enum only as an input
# domain, and its boundaries are about a planar pose transform, not about a transcendental series.
#
# Two gaps this inventory has and does not hide.
#
# 1. `claim_ids` is empty on all three entries, so nothing here reaches
#    `docs/assurance/01-assurance-sitemap.md` — that report is generated from `proofs/claims.toml`
#    alone and never reads a boundary inventory, so `generate_assurance_report.py --check` passing
#    says nothing about this file. A claim needs a Lean theorem to register against, and `formal/`
#    has no clothoid model; writing one is the work that would close this, not an edit here. The
#    same gap exists on `emit-numeric-boundaries-v0.toml`, so it is a property of the sitemap
#    generator rather than of this slice, and it is called out in both places rather than in
#    neither.
# 2. Of the four libm functions the corner solve depends on — `hypot`, `atan2`, `sqrt`, `tan` — none
#    is covered by a named accuracy contract. `proofs/libm-0.2.16-trig-contract.md` is scoped to
#    `sin` and `cos` over [-7, 7]. What that costs is stated on CORNER_SOLVE, measured, and carried
#    as its next obligation.
# ---------------------------------------------------------------------------------------------

[[boundary]]
id = "FM1.F64.RESOLVE.CLOTHOID.FRESNEL_SERIES"
title = "The Euler spiral's Fresnel integrals are summed to a relative term threshold, not an absolute one"
rust_symbol = "fresnel_with_terms"
source_path = "crates/core/src/clothoid.rs"
source_anchor = "pub const FRESNEL_SERIES_EPSILON: f64 = 1e-17;"
inputs = ["Op::Clothoid.blend", "Op::Clothoid.{corner_x,corner_y}", "Op::Clothoid.{x,y}", "running position"]
operation = "Cf(t) and Sf(t) are summed from their Maclaurin series by term ratio, each stopping when |term| <= 1e-17 * |partial sum| or at a hard cap of 32 iterations past the leading term, i.e. 33 terms. A sampled spiral point is A*Cf(tau) with A = blend / (Cf(sigma) + Sf(sigma)*tan(theta)); the relative threshold is what makes the position error a fixed fraction of `blend` rather than a fixed fraction of A, which is unbounded above as the deflection shrinks."
classification = "interval-bounded"
numeric_status = "bounded"
assumptions = [
  "libm::cos and libm::sin are within 1 ulp (the imported contract in proofs/libm-0.2.16-trig-contract.md). They are not used by the series itself, which is polynomial, but they are used by the composite-Simpson quadrature the series is measured against, so the measurement inherits the assumption.",
  "The argument never exceeds sqrt(pi): a corner deflects by strictly less than 180 degrees, so theta < pi/2 and sigma = sqrt(2*theta) < sqrt(pi). The larger-argument regime, where this series loses to the asymptotic form, is unreachable from the node.",
  "The alternating terms decrease monotonically past the second one across that whole argument range, so the truncation error is bounded by the first omitted term.",
]
exclusions = [
  "Arguments above sqrt(pi). Nothing in the node produces one; a caller reaching `fresnel` directly for a longer spiral is outside this bound. The Abramowitz & Stegun cross-check in crates/core/tests/clothoid.rs is deliberately one such caller, by exactly one ulp: the tabulated values are defined under the substitution t = u*sqrt(pi), so reproducing them needs the correctly rounded sqrt(pi) (1.772453850905516), which is the next double above the node's own maximum argument (1.7724538509055159). The two constants are kept apart in that file, and one ulp is visible in the result — 1.11e-16 and 0 at the reference point, 2.22e-16 and 1.67e-16 one ulp down.",
  "The rounding error of the summation itself, which is folded into the measured agreement with quadrature rather than analysed term by term.",
  "The accuracy of the composite-Simpson reference beyond its own arithmetic: 2^16 intervals put its truncation error far below its accumulated rounding, and the published ceiling is that rounding floor, not the series error.",
]
next_obligation = "If the node ever admits a spiral longer than one turn of a corner — a standalone spiral op, or an asymmetric blend — re-derive the argument bound before reusing this series; the entry is scoped to sigma < sqrt(pi) and says so."
evidence = [
  "crates/core/src/clothoid.rs",
  "crates/core/tests/clothoid.rs",
]
