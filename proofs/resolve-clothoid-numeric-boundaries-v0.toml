[[boundary]]
id = "FM1.F64.RESOLVE.CLOTHOID.CORNER_SOLVE"
title = "A corner with no symmetric clothoid blend is refused exactly, never clamped into one that fits"
rust_symbol = "corner_blend"
source_path = "crates/core/src/clothoid.rs"
source_anchor = "    if blend > incoming_len {"
inputs = ["Op::Clothoid.blend", "Op::Clothoid.{corner_x,corner_y}", "Op::Clothoid.{x,y}", "running position"]
operation = "Five ordered rejections, each an exact comparison: zero-length incoming leg, zero-length outgoing leg, blend exceeding either leg, deflection exactly zero, deflection exactly pi. A sixth is an is_finite test on everything the solve produced, so an overflowed corner is refused rather than reaching Length::mm. None of the six carries an epsilon, and none substitutes a nearby corner for the one supplied."
classification = "rejected"
numeric_status = "not-applicable"
assumptions = [
  "atan2 returns exactly PI for exactly antiparallel unit legs and exactly 0.0 for exactly codirectional ones, which is what makes the two angular rejections exact rather than thresholded.",
  "Both refusals run in `validate_design_geometry` before the lowering, over the same helper and the same numbers, so a corner that lowers is exactly a corner that validated.",
]
exclusions = [
  "Deflections arbitrarily close to 0 or pi, which are *not* refused: both have finite solutions (a nearly straight blend, and a tight U-turn respectively), and the leg-fit check is what bounds them. Refusing a band around either endpoint would be a magnitude policy of the kind ADR 0002 section 2 rejects.",
  "Whether a machine can execute the resulting corner. The rule states only that the corner exists and closes.",
  "The Z coordinate, which `resolve` interpolates along the solved XY path and which no rejection here inspects.",
]
next_obligation = "If the node ever grows an asymmetric blend (different tangent lengths per leg), the single blend-versus-leg rule splits into two independent ones and this entry must list them separately, since a caller could then overrun one leg while satisfying the other."
