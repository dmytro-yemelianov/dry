[[boundary]]
id = "FM1.F64.RESOLVE.CLOTHOID.CHORD_SAMPLING"
title = "The blend is lowered as a fixed 2*SAMPLES chord polyline whose departure from the spiral scales with the blend"
rust_symbol = "corner_blend"
source_path = "crates/core/src/clothoid.rs"
source_anchor = "    let mut points = Vec::with_capacity(2 * SAMPLES);"
inputs = ["Op::Clothoid.blend", "Op::Clothoid.{corner_x,corner_y}", "Op::Clothoid.{x,y}", "resolve::SAMPLES"]
operation = "Each half is sampled at 16 uniform steps of the normalised arc length tau, giving 32 chords for the whole blend, and `resolve` emits them as plain SegmentKind::Line segments. The count is fixed rather than tolerance-driven, exactly as it is for a Catmull-Rom span, so the number of segments a design produces is a function of the design alone and not of its scale."
classification = "interval-bounded"
numeric_status = "bounded"
assumptions = [
  "The Fresnel parameterisation is unit-speed, so uniform steps in tau are uniform in arc length and the chords are of equal length up to curvature; that is what makes a single relative deviation bound cover the whole blend.",
  "The blend never turns by more than 180 degrees in total, so no chord subtends more than 5.625 degrees of tangent rotation.",
]
exclusions = [
  "Any adaptive or tolerance-driven subdivision: there is none, and a user who needs a tighter chord must ask for a smaller blend or, in a later slice, a configurable sample count.",
  "The departure of the *straight legs* from anything, which is zero by construction — they are straight.",
  "Whether 32 chords is the right count for a given machine's look-ahead. That is a process question, not a numeric one.",
]
next_obligation = "If SAMPLES ever becomes configurable, the published deviation ceiling becomes a function of it and this entry must state the count it was measured at."
