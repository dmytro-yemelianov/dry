scope = "The binary64 boundary of the tolerance-bearing predicate in crates/core/src/emit/kinematics.rs: the singular-cone test that decides whether a toolframe orientation determines the C rotary axis, from Segment.orientation through the words its two consumers emit - the rotary and linear words of crates/core/src/emit/gcode.rs, and the KUKA A/B angles of crates/core/src/emit/krl.rs. Only kinematics.rs is hash-pinned below: the consumers are recorded as evidence, so a consumer drifting off resolve_c is caught by its own tests and not by this file."
