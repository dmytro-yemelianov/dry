id = "FM1.F64.EMIT.ROTARY.SINGULAR_CONE"
title = "The C axis is held, not recomputed, where the tool direction stops determining it"
rust_symbol = "resolve_c"
source_path = "crates/kernel/src/emit/kinematics.rs"
source_anchor = "const SINGULAR_CONE_SIN_TILT: f64 = 1e-9;"
inputs = ["Segment.orientation", "Kinematics::Ac", "Kinematics::Bc"]
operation = "On the normalised tool direction [i, j, k]: when hypot(i, j) > 1e-9 the C joint is atan2(j, i) and the emitter's RotaryState records it; otherwise the recorded value is reused unchanged. The resolved C feeds both the rotary word and machine_position, so a line's linear and rotary halves always describe one machine state. RotaryState is seeded at 0 (the identity), which is what a program starting inside the cone emitted before this predicate existed."
classification = "interval-bounded"
numeric_status = "bounded"
assumptions = [
  "The direction is already normalised by unit_orientation, so hypot(i, j) is the sine of the tilt from +Z and lies in [0, 1] regardless of the caller's vector length.",
  "The emitter formats rotary words with {v:.6} degrees, so a direction change below 1e-6 degrees cannot appear in the emitted program.",
  "Ac and Bc are the only models with a C axis; Ab is left untouched and does not advance the state.",
  "The KRL renderer (crates/kernel/src/emit/krl.rs) is a second consumer of this predicate: it resolves every pose through Bc with zero offsets, because that model is the KUKA ZYX-Euler decomposition with the roll pinned, and the C word it holds becomes the emitted KUKA A angle. Its angle format is the same num_checked {v:.6}, so the resolution assumption above carries over unchanged. It does not use machine_position -- an E6POS is a TCP pose in $BASE, not a point in a rotated table frame -- so only the rotary half of the operation applies there.",
]
exclusions = [
  "Ab's analogous singularity: B = atan2(i, k) is equally undetermined with the tool along ±Y (i = k = 0), and is not addressed here.",
  "Tilts in (1e-9, ~1e-8], where acos(k) has already collapsed to exactly 0 for a unit direction but C is still recomputed. Closing that needs the tilt recovered as atan2(hypot(i, j), k) rather than acos(k), which changes Ac/Bc more broadly than this predicate.",
  "Rotary words inside a ManualGcode segment, which the emitter passes through verbatim and which therefore cannot advance or be constrained by the tracked C.",
  "Whether the held C is reachable on a given machine: the rule states only that the program stops commanding a rotation that carries no direction.",
]
next_obligation = "Keep this at or below the tilt whose worst-case substituted direction error, 2*asin(eps), stays under the emitter's 1e-6 degree word resolution. If num() ever formats to more or fewer decimals, the epsilon and this entry move with it."
