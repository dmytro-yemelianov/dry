# Re-pinned 2026-08-30. The reviewed diff is 591ccf0's 6-axis robot solver — DH link parameters, a
# forward solve, and a closed-form inverse solve — plus naming its wrist epsilon
# `WRIST_SINGULAR_J5_RAD` so the profile can pin it. The 5-axis singular-cone predicate, its constant
# and its budgets are untouched; the two new predicates the commit introduced are registered at the
# end of this file. Also folded in: the assertion moved inside its sampling loop in the
# `worst_measured` test (a running max, so the check is equivalent), and a rustfmt-only reformat.
#
# Re-pinned again the same day for the follow-up that review produced: `solve_ik` now refuses a
# non-finite TCP point, a zero or non-finite tool direction and a non-finite previous joint state,
# and normalises the direction through `unit_orientation`. Both are narrowings — the refused inputs
# previously returned `Ok` with `NaN` in every joint, and a non-unit direction silently displaced the
# wrist centre by `d6·(‖v‖ − 1)`. Neither touches the cone predicate or either 6-axis threshold.
# Re-pinned 2026-08-30 for a doc-comment-only change: the forward solves now state their
# finite-joint precondition and name the boundary that enforces it (`multi_robot`'s clearance checks,
# which now fail closed). No code, constant or predicate moved.
sha256 = "edbfc77f65843ada79754ebeb8074e16d97110050eec398c1c8bc4f3ad0d5e01"

# ---------------------------------------------------------------------------------------------
# The 5-axis side owns exactly one tolerance-bearing predicate, and this is it. Everything else on
# that path in `emit/kinematics.rs` is an exact comparison (`magnitude > 0.0`, `is_finite`) or a total
# function of the normalised direction, so nothing else there carries an epsilon. The same holds of
# the KRL renderer's own refusals (`!= 0.0`, `> 0.0`, "does the formatted literal denote zero"): all
# exact, none an epsilon, so none registered here.
#
# That sentence read "the emit side owns exactly one" until 591ccf0 added `Robot6AxisModel` to this
# file, at which point it was simply false: the 6-axis solver carries a second epsilon and a refusal
# of its own. Both are registered at the end of this file. The claim is now scoped to the 5-axis path
# rather than to the file, so adding a third predicate anywhere in `kinematics.rs` contradicts nothing
# here and is caught by the hash pin instead.
#
# What is pinned is `emit/kinematics.rs` alone. `gcode.rs` and `krl.rs` consume `resolve_c` and are
# listed as evidence, not as `[[source]]`, so this file does not detect a consumer drifting away
# from the predicate -- their own tests do (`tests/five_axis_singular_cone.rs`,
# `tests/krl_program_structure.rs`). Stated because the previous `scope` read as though the whole
# emit path were under the pin.
#
# This inventory is separate from `verify-numeric-boundaries-v0` on purpose: that one declares itself
# scoped to `verify.rs`, and an emit-side epsilon has a different input domain (a *direction*, not a
# coordinate) and a different failure mode (wasted rotary motion, not a missed finding).
# ---------------------------------------------------------------------------------------------

[[boundary]]
id = "FM1.F64.EMIT.ROTARY.SINGULAR_CONE"
title = "The C axis is held, not recomputed, where the tool direction stops determining it"
rust_symbol = "resolve_c"
source_path = "crates/core/src/emit/kinematics.rs"
source_anchor = "const SINGULAR_CONE_SIN_TILT: f64 = 1e-9;"
inputs = ["Segment.orientation", "Kinematics::Ac", "Kinematics::Bc"]
operation = "On the normalised tool direction [i, j, k]: when hypot(i, j) > 1e-9 the C joint is atan2(j, i) and the emitter's RotaryState records it; otherwise the recorded value is reused unchanged. The resolved C feeds both the rotary word and machine_position, so a line's linear and rotary halves always describe one machine state. RotaryState is seeded at 0 (the identity), which is what a program starting inside the cone emitted before this predicate existed."
classification = "interval-bounded"
numeric_status = "bounded"
assumptions = [
  "The direction is already normalised by unit_orientation, so hypot(i, j) is the sine of the tilt from +Z and lies in [0, 1] regardless of the caller's vector length.",
  "The emitter formats rotary words with {v:.6} degrees, so a direction change below 1e-6 degrees cannot appear in the emitted program.",
  "Ac and Bc are the only models with a C axis; Ab is left untouched and does not advance the state.",
  "The KRL renderer (crates/core/src/emit/krl.rs) is a second consumer of this predicate: it resolves every pose through Bc with zero offsets, because that model is the KUKA ZYX-Euler decomposition with the roll pinned, and the C word it holds becomes the emitted KUKA A angle. Its angle format is the same num_checked {v:.6}, so the resolution assumption above carries over unchanged. It does not use machine_position -- an E6POS is a TCP pose in $BASE, not a point in a rotated table frame -- so only the rotary half of the operation applies there.",
]
exclusions = [
  "Ab's analogous singularity: B = atan2(i, k) is equally undetermined with the tool along ±Y (i = k = 0), and is not addressed here.",
  "Tilts in (1e-9, ~1e-8], where acos(k) has already collapsed to exactly 0 for a unit direction but C is still recomputed. Closing that needs the tilt recovered as atan2(hypot(i, j), k) rather than acos(k), which changes Ac/Bc more broadly than this predicate.",
  "Rotary words inside a ManualGcode segment, which the emitter passes through verbatim and which therefore cannot advance or be constrained by the tracked C.",
  "Whether the held C is reachable on a given machine: the rule states only that the program stops commanding a rotation that carries no direction.",
]
next_obligation = "Keep this at or below the tilt whose worst-case substituted direction error, 2*asin(eps), stays under the emitter's 1e-6 degree word resolution. If num() ever formats to more or fewer decimals, the epsilon and this entry move with it."
evidence = [
  "crates/core/src/emit/kinematics.rs",
  "crates/core/src/emit/gcode.rs",
  "crates/core/src/emit/krl.rs",
  "crates/core/tests/five_axis_singular_cone.rs",
]
claim_ids = []
profile_entries = [
  "FM1.NUMERIC.PROFILE.EMIT.KINEMATICS.V0.LIMIT.TOOL_DIRECTION_COMPONENT",
  "FM1.NUMERIC.PROFILE.EMIT.KINEMATICS.V0.BUDGET.SINGULAR_CONE_SIN_TILT",
  "FM1.NUMERIC.PROFILE.EMIT.KINEMATICS.V0.BUDGET.HELD_C_TOOL_DIRECTION_ERROR_RAD",
]

