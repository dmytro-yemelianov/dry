[[boundary]]
id = "FM1.F64.EMIT.ROBOT6.WRIST_SINGULAR_HOLD"
title = "J4 is held, not recomputed, where the wrist pose stops determining it"
rust_symbol = "Robot6AxisModel::solve_ik"
source_path = "crates/core/src/emit/kinematics.rs"
source_anchor = "const WRIST_SINGULAR_J5_RAD: f64 = 1e-5;"
inputs = [
  "tcp_pos: the commanded TCP point in millimetres",
  "tool_orient: the tool-direction vector",
  "prev_joints: the joint state the previous segment left behind",
  "Robot6AxisModel.dh: the six DhParam link parameters",
]
operation = "The tool direction is expressed in frame 3 as R03^T * tool_orient; J5 is atan2(hypot(x, y), z) of that vector. When |J5| < 1e-5 rad the wrist is colinear, J5 is snapped to exactly 0 and J4 is taken unchanged from prev_joints.j4_deg; otherwise J4 is atan2(y, x). J6 is not solved and is returned as 0 in both branches."
classification = "interval-bounded"
numeric_status = "bounded"
assumptions = [
  "prev_joints carries a J4 the caller actually reached; the solver cannot tell a seeded default from a measured state, exactly as RotaryState's C is seeded at the identity.",
  "tool_orient is normalised through unit_orientation before use, exactly as the 5-axis path does, so a direction's length cannot shift the wrist centre; a zero or non-finite direction is refused rather than solved.",
  "The DH convention is standard (not modified) DH, with alpha4 = +PI/2 and alpha5 = -PI/2 as the doc comment states.",
]
exclusions = [
  "The worst-case TCP displacement caused by substituting the held J4 at the threshold: not derived, which is why the linked budget is `policy` rather than `bounded`.",
  "J6 entirely. The solver returns a six-joint struct whose sixth element is always 0.0, so this is a five-degree-of-freedom solve presented in a six-joint shape; tool roll is neither solved nor preserved.",
  "The elbow/shoulder configuration choice. Only the positive-sin_phi (elbow-up) branch is produced; the mirrored solutions of the same pose are never considered, so the solver cannot follow a path that requires reconfiguration.",
  "Joint travel limits and self-collision: solve_ik refuses only points outside the arm's reach, not poses the arm cannot legally adopt.",
]
next_obligation = "Derive the TCP error implied by the held J4 and promote the budget to `bounded`, or tighten the threshold to what the derivation supports. J6 is now documented as unsolved on solve_ik itself and pinned by solve_ik_does_not_determine_j6; actually solving it needs a roll reference this signature does not take, so it remains a design question rather than a bug."
evidence = [
  "crates/core/src/emit/kinematics.rs",
  "crates/core/tests/robot_6axis_kinematics.rs",
]
claim_ids = []
profile_entries = [
  "FM1.NUMERIC.PROFILE.EMIT.KINEMATICS.V0.BUDGET.WRIST_SINGULAR_J5_RAD",
]

[[boundary]]
id = "FM1.F64.EMIT.ROBOT6.REACH_REJECTION"
title = "A target beyond the arm's reach is refused by a cosine that rounds past one"
rust_symbol = "Robot6AxisModel::solve_ik"
source_path = "crates/core/src/emit/kinematics.rs"
source_anchor = "if cos_phi.abs() > 1.0 {"
inputs = [
  "tcp_pos and tool_orient, through the wrist centre",
  "Robot6AxisModel.dh link lengths a1, a2, a3, d1, d4, d6",
]
operation = "The elbow angle is recovered from the law of cosines: cos_phi = (d_sq - a2^2 - l3^2) / (2*a2*l3), where d_sq is the squared shoulder-to-wrist distance and l3 = hypot(a3, d4). |cos_phi| > 1.0 means no triangle closes, and the solve returns Err rather than a pose. Immediately after, sin_phi is (1 - cos_phi^2).max(0.0).sqrt(), whose clamp is load-bearing: cos_phi*cos_phi can exceed 1 in binary64 for a cos_phi within an ULP of +/-1, which would otherwise make the radicand negative and sin_phi NaN."
classification = "rejected"
numeric_status = "not-applicable"
assumptions = [
  "The refusal is exact in the comparison but not in the quantity compared: cos_phi is the result of three multiplications, two subtractions and a division, so a target exactly at full extension can land on either side of 1.0 by rounding.",
  "a2 and l3 are non-zero for every shipped model, so the division is finite; a model with a2 = 0 or a3 = d4 = 0 would divide by zero and is not guarded.",
]
exclusions = [
  "How far outside reach a refused point is: the error carries no distance, so a caller cannot tell a target 0.1 mm past the envelope from one a metre past it.",
  "The interior of the workspace. Reachability here is the elbow triangle alone; joint travel limits, the shoulder singularity at r = 0, and self-collision are all unmodelled, so an accepted solve is not a claim that the pose is attainable.",
  "Non-finite input reaching *this* comparison: it cannot. A NaN tcp_pos would make cos_phi NaN and NaN.abs() > 1.0 is false, so this refusal alone never fired on it — solve_ik now rejects a non-finite TCP point, a zero or non-finite tool direction and a non-finite previous joint state at entry instead, so the reach test only ever sees finite input.",
]
next_obligation = "Settled: solve_ik now refuses non-finite input at entry and normalises its tool direction through unit_orientation, so both entry points into this file agree. The forward solves (solve_fk, solve_fk_pose, solve_all_link_positions) still return plain values and have no error channel to refuse into, which is the remaining asymmetry."
evidence = [
  "crates/core/src/emit/kinematics.rs",
  "crates/core/tests/robot_6axis_kinematics.rs",
]
claim_ids = []
profile_entries = [
  "FM1.NUMERIC.PROFILE.EMIT.KINEMATICS.V0.LIMIT.ELBOW_COSINE",
]
