'''

[[mutation]]
id = "reverse-orientation-field-order"
witness = "orientation-field-order"
description = "Validate orientation components in reverse field order."
old = '''
                let vector = transform.apply_vector([
                    require_finite(*i, &format!("{op_path}.i"))?,
                    require_finite(*j, &format!("{op_path}.j"))?,
                    require_finite(*k, &format!("{op_path}.k"))?,
                ]);
'''
new = '''
                let vector = transform.apply_vector([
                    require_finite(*k, &format!("{op_path}.k"))?,
                    require_finite(*j, &format!("{op_path}.j"))?,
                    require_finite(*i, &format!("{op_path}.i"))?,
                ]);
'''

