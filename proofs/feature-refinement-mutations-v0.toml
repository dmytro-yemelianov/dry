id = "orientation-receives-translation"
witness = "orientation-ignores-translation"
description = "Transform an orientation as a point instead of a vector."
old = "let vector = transform.apply_vector([*i, *j, *k]);"
new = "let vector = transform.apply_point([*i, *j, *k]);"

