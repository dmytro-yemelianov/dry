[[mutation]]
id = "skip-zero-repeat-step-validation"
witness = "repeat-step-validated-at-zero-count"
description = "Skip repeat-step validation when count is zero."
old = '''            let step = Transform::from_pose(*step, &format!("{path}.step"))?;'''
new = '''
            let step = if *count == 0 {
                Transform::identity()
            } else {
                Transform::from_pose(*step, &format!("{path}.step"))?
            };
'''

