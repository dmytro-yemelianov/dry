[[mutation]]
id = "move-resets-local-position"
witness = "move-inherits-local-position"
description = "Discard the local position established by a move."
old = '''
            Op::Move { x, y, z } => {
                let local = inherit_point([*x, *y, *z], position, &op_path)?;
                position = local.map(Some);
                let point = transform.apply_point(local);
'''
new = '''
            Op::Move { x, y, z } => {
                let local = inherit_point([*x, *y, *z], position, &op_path)?;
                position = [None; 3];
                let point = transform.apply_point(local);
'''

[[mutation]]
id = "arc-end-before-start"
witness = "arc-requires-local-start-before-end"
description = "Validate an arc endpoint before its required local start."
# The two lines this reorders are byte-identical in the `Op::Clothoid` arm that P5.5 added, so the
# snippet now carries the arc arm's own `clockwise,` field to stay uniquely anchored. The mutated
# bytes are unchanged; only the context that locates them grew. The clothoid arm's equivalent
# ordering is deliberately *not* mutation-covered — the Lean refinement corpus has no clothoid op, so
# there is no witness fixture to kill such a mutation — and is pinned instead by
# `a_clothoid_in_a_feature_needs_a_defined_local_start` in crates/kernel/tests/clothoid.rs.
old = '''
                clockwise,
            } => {
                require_defined_position(position, &op_path)?;
                let local = inherit_point([*x, *y, *z], position, &op_path)?;
'''
new = '''
                clockwise,
            } => {
                let local = inherit_point([*x, *y, *z], position, &op_path)?;
                require_defined_position(position, &op_path)?;
'''

[[mutation]]
id = "spline-point-before-start"
witness = "spline-requires-local-start-before-points"
description = "Skip the local-start precheck for a nonempty spline."
old = '''
            Op::Spline { points } => {
                if !points.is_empty() {
                    require_defined_position(position, &op_path)?;
                }
                let mut transformed = Vec::with_capacity(points.len());
'''
new = '''
            Op::Spline { points } => {
                let mut transformed = Vec::with_capacity(points.len());
'''

