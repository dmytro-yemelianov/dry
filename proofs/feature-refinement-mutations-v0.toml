[[mutation]]
id = "sanitize-nonfinite-move"
witness = "nonfinite-move-coordinate"
description = "Silently replace non-finite move coordinates with zero."
old = '''
            Op::Move { x, y, z } => {
                let local = inherit_point([*x, *y, *z], position, &op_path)?;
'''
new = '''
            Op::Move { x, y, z } => {
                let local = inherit_point(
                    [
                        x.map(|value| if value.is_finite() { value } else { 0.0 }),
                        y.map(|value| if value.is_finite() { value } else { 0.0 }),
                        z.map(|value| if value.is_finite() { value } else { 0.0 }),
                    ],
                    position,
                    &op_path,
                )?;
'''

[[mutation]]
id = "sanitize-nonfinite-spline"
witness = "nonfinite-spline-point"
description = "Silently replace non-finite spline-point coordinates with zero."
old = '''
                    let local = inherit_point(
                        *point,
                        position,
                        &format!("{op_path}.points[{point_index}]"),
                    )?;
'''
new = '''
                    let sanitized = (*point).map(|axis| {
                        axis.map(|value| if value.is_finite() { value } else { 0.0 })
                    });
                    let local = inherit_point(
                        sanitized,
                        position,
                        &format!("{op_path}.points[{point_index}]"),
                    )?;
'''

[[mutation]]
id = "skip-arc-centre-finite-check"
witness = "arc-centre-field-order"
description = "Pass Arc centre components into arithmetic without checking finiteness."
old = '''
                let centre = transform.apply_xy([
                    require_finite(*cx, &format!("{op_path}.cx"))?,
                    require_finite(*cy, &format!("{op_path}.cy"))?,
                ]);
'''
new = '''
                let centre = transform.apply_xy([*cx, *cy]);
'''

[[mutation]]
id = "reverse-arc-centre-field-order"
witness = "arc-end-before-nonfinite-centre"
description = "Check Arc centre fields before the inherited endpoint."
old = '''
                let local = inherit_point([*x, *y, *z], position, &op_path)?;
                position = local.map(Some);
                let end = transform.apply_point(local);
                let centre = transform.apply_xy([
                    require_finite(*cx, &format!("{op_path}.cx"))?,
                    require_finite(*cy, &format!("{op_path}.cy"))?,
                ]);
'''
new = '''
                let local_cx = require_finite(*cx, &format!("{op_path}.cx"))?;
                let local = inherit_point([*x, *y, *z], position, &op_path)?;
                position = local.map(Some);
                let end = transform.apply_point(local);
                let centre = transform.apply_xy([
                    local_cx,
                    require_finite(*cy, &format!("{op_path}.cy"))?,
                ]);
'''

