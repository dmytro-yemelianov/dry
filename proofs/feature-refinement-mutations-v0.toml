[[mutation]]
id = "group-reverse-source-order"
witness = "group-source-order"
description = "Iterate group children in reverse source order."
old = "for (index, child) in children.iter().enumerate() {"
new = "for (index, child) in children.iter().rev().enumerate() {"

[[mutation]]
id = "repeat-at-most-once"
witness = "repeat-count-and-order"
description = "Expand at most one repeat instance."
old = "for index in 0..*count {"
new = "for index in 0..(*count).min(1) {"

[[mutation]]
id = "repeat-at-least-once"
witness = "repeat-zero-skips-invalid-child"
description = "Expand one repeat instance even when count is zero."
old = "for index in 0..*count {"
new = "for index in 0..(*count).max(1) {"

[[mutation]]
id = "move-resets-local-position"
witness = "move-inherits-local-position"
description = "Discard the local position established by a move."
old = '''
            Op::Move { x, y, z } => {
                let local = inherit_point([*x, *y, *z], position, &op_path)?;
                position = local.map(Some);
                let point = transform.apply_point(local);
'''
new = '''
            Op::Move { x, y, z } => {
                let local = inherit_point([*x, *y, *z], position, &op_path)?;
                position = [None; 3];
                let point = transform.apply_point(local);
'''

[[mutation]]
id = "arc-end-before-start"
witness = "arc-requires-local-start-before-end"
description = "Validate an arc endpoint before its required local start."
old = '''
                require_defined_position(position, &op_path)?;
                let local = inherit_point([*x, *y, *z], position, &op_path)?;
'''
new = '''
                let local = inherit_point([*x, *y, *z], position, &op_path)?;
                require_defined_position(position, &op_path)?;
'''

[[mutation]]
id = "spline-point-before-start"
witness = "spline-requires-local-start-before-points"
description = "Skip the local-start precheck for a nonempty spline."
old = '''
            Op::Spline { points } => {
                if !points.is_empty() {
                    require_defined_position(position, &op_path)?;
                }
                let mut transformed = Vec::with_capacity(points.len());
'''
new = '''
            Op::Spline { points } => {
                let mut transformed = Vec::with_capacity(points.len());
'''

