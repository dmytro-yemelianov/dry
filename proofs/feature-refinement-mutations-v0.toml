[[mutation]]
id = "node-before-depth"
witness = "depth-budget-before-node-visit"
description = "Visit and count a node before checking its depth."
old = '''
    if depth > state.limits.max_depth {
        return Err(ExpandError::new(format!(
            "{path} exceeds max feature depth ({})",
            state.limits.max_depth
        )));
    }
    state.visit_node(path)?;
'''
new = '''
    state.visit_node(path)?;
    if depth > state.limits.max_depth {
        return Err(ExpandError::new(format!(
            "{path} exceeds max feature depth ({})",
            state.limits.max_depth
        )));
    }
'''

[[mutation]]
