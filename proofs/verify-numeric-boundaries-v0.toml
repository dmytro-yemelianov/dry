# Re-pinned 2026-08-26 for the tool-holder collision slice. The reviewed diff against the previous
# hash is exactly four lines in verify.rs: a `#[path]` module declaration for verify/collision.rs
# and a `pub use` re-export of its three public items. No predicate, no epsilon, no constant and
# no rule behaviour changed, and none of the four boundaries' `operation` text moved. The
# collision checker is not one of the always-on structural rules this inventory scopes: it is a
# separately-invoked pre-flight check living in its own unpinned file, and it is not wired into
# `Report`. Its arithmetic is six inclusive comparisons bounding an XY window, one strict `z <
# stock_top_z`, a single `stock_top_z - z` subtraction and one comparison of that difference
