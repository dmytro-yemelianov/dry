# ---------------------------------------------------------------------------------------------
# The tool-holder collision rule. It is not one of the always-on structural predicates — callers
# invoke it explicitly and it does not appear in `Report` — but it is binary64 geometry deciding
# whether a program is safe to run, which is exactly what this inventory exists to pin.

[[boundary]]
id = "FM1.F64.VERIFY.COLLISION.HOLDER_DEPTH"
title = "Holder fouling is decided by one subtraction against the stickout length"
rust_symbol = "check_tool_holder_collision"
source_path = "crates/core/src/verify/collision.rs"
source_anchor = "let depth = stock_top_z - z;"
inputs = [
  "Segment end coordinates in millimetres",
  "stock_bounds[0..6] in millimetres",
  "ToolHolder.stickout_length",
  "ToolHolder.holder_diameter",
  "ToolHolder.collet_diameter"
]
operation = "Four inclusive comparisons place the segment end inside the stock footprint expanded by the larger of the holder and collet radii, one strict comparison places it below the stock top, then a single subtraction stock_top_z - z is compared against stickout_length. No transcendentals, no tolerance, and no accumulation: each segment end is judged independently."
classification = "exact-in-range"
numeric_status = "bounded"
assumptions = [
  "Segment end coordinates and stock bounds are finite; the resolver's own gates enforce that upstream.",
  "The comparisons are IEEE-754 total on finite operands, so a point exactly on a boundary is decided by the stated inclusive/strict split rather than by rounding."
]
exclusions = [
  "The subtraction rounds once when the operands differ widely in magnitude; it is exact under Sterbenz, which covers every depth within a factor of two of the stock top.",
  "ToolHolder.collet_length, which no rule reads: it bounds the collet upwards and the only obstruction modelled here is the stock top plane, which the holder face reaches first.",
  "Everything the module name suggests but does not model — fixtures, clamps, the gantry, previously machined pockets, and stock walls other than the top plane.",
  "Segments whose end coordinates are None, which are skipped rather than treated as a collision or as safe."
]
exact_envelope = [
  "Depths within a factor of two of the stock top, where stock_top_z - z is exact by Sterbenz's lemma."
]
next_obligation = "Model the obstructions the module's name implies — at minimum fixture volumes and previously machined stock — so that a holder clearing the top plane is not reported as safe when it fouls a clamp."
evidence = [
  "crates/core/tests/collision_checker.rs"
]
