# geometry with no inventory of its own; giving verify/collision.rs a pinned source and a
# FM1.F64.VERIFY.COLLISION.* entry is outstanding. Worth recording for whoever picks that up:
# `ToolHolder` declares holder_diameter, collet_diameter and collet_length, and
# `check_tool_holder_collision` reads none of them — the rule is a plunge-depth-versus-stickout
# test, not the holder interference check its name implies.
#
# Re-pinned 2026-08-27 for the contract-usability change. This one DOES change rule behaviour
# and the diff should be read as such: a contract whose value is not finite no longer counts as
# in force, so the rule holding it is absent from `Report::rules_evaluated` instead of being
# listed there. A NaN ceiling makes every ordering comparison false, so that rule could never
# fire while still being reported as evaluated — the exact vacuous pass this inventory's own
# design note (H1.3 section 3.5) exists to prevent. It changes no tolerance, no epsilon and no
# predicate: the four boundaries pinned below are always-on rules, unaffected by contract
# presence, and none of their `operation` text moves.
