# The verify half of the vocabulary crate: everything this inventory used to cover whole-file inside
# verify.rs and that the crate split moved out. The contract structs and their serde field
# attributes, `ContractParseError`, the CSV contract parsers, `Severity`, the whole of `impl RuleId`
# -- `ALL`, `as_str`, `from_wire`, `default_severity`, `is_evaluated` -- and, last, the arc-radius
# epsilon itself.
#
# Sliced rather than whole-file, and the split is by *provenance*. The rest of the file is the
# kinematics that came out of `emit/kinematics.rs`, pinned by `emit-numeric-boundaries-v0.toml` on
# the same reasoning. Between them the two inventories cover every declaration, impl and constant in
# the crate, while each one fires only on the content it owns: a rotary-model edit does not present
# as a verify review, and a rule-severity edit does not present as an emit one. That routing is what
# a whole-file pin from both inventories would destroy, and it is the whole argument for slicing
# here.
#
# The first version of this pin got the extent wrong and is worth recording, because the mistake is
# an easy one to repeat: it covered the epsilon alone -- 7 lines of 720, on the argument that the
# rest of the crate is inert vocabulary. It is not inert. This file's own 2026-08-03 re-pin exists
# *because* `RuleId::default_severity` changed, and that note says in as many words that it "does
# change rule behaviour". `RuleId::ALL` and `is_evaluated` decide which rules are evaluated at all,
# and therefore what `Report::rules_evaluated` is entitled to claim. `parse_bounds_csv` decides what
# a `--bounds` string means. Demoting `RuleId::Bounds` to a warning, or returning `v[5] + 1.0` from
# the bounds parser, were both caught by the whole-file pin before the move and both passed green
# under the narrow slice. They are inside this one.
#
# Deliberately outside review, in full: the crate doc comment, `#![forbid(unsafe_code)]` and the
# `use serde::{Deserialize, Serialize};` line -- the 17 lines above the first item, which contain no
# code. Nothing executable in drymachina-contracts sits outside the two slices.
