# Re-pinned for the arc-radius entry below. The reviewed diff against the previous hash is a doc
# comment plus `const` -> `pub(crate) const` on ARC_RADIUS_TOLERANCE_MM: no predicate, no epsilon
# value and no rule behaviour changed, and none of the four boundaries' `operation` text moved.
#
# Re-pinned 2026-08-03 for the commercial-license slice. The reviewed diff against the previous
# hash is exactly five lines: an optional `pub license: Option<crate::report::LicenseStamp>`
# serde field (skip-if-none + default) on the `Report` envelope, never set by the engine. No
# predicate, no epsilon value, no rule behaviour and none of the boundaries' `operation` text
# changed; the field is serialization-only and sits outside every tolerance-bearing path.
#
# Re-pinned 2026-08-03 for the `travel-extrudes` severity change (PR #224). The reviewed diff is
# `RuleId::TravelExtrudes` moving into the Warning arm of `default_severity`, the comment block
# that justifies it, one word in the `RuleId` doc comment, and two in-module tests that enumerate
# the warning set and count the error-severity always-on rules (8, was 9). This *does* change rule
# behaviour — precisely: the severity field of a `travel-extrudes` finding, and therefore
# `Report::ok()` / `error_count()` on IR that trips it. It changes no tolerance predicate,
# introduces and removes no epsilon, alters no constant, and moves none of the four boundaries'
# `operation` text: `travel-extrudes` is an exact comparison
# (`s.travel && s.volume.value() > 0.0`), carries no tolerance of its own, and has no entry in
# this file — the boundaries pinned below (continuity, segment/arc length, filament ratio, arc
# radius) are untouched in both predicate and epsilon, and each still fires at Error.
#
# Re-pinned 2026-08-03 at the merge of the two slices above: the hash below is verify.rs carrying
# both reviewed diffs combined, with no further change.
#
# Re-pinned 2026-08-04 for the pilot false-positive slice (first real user file: a 123,613-line
# OrcaSlicer 2.4.2 slice for a Creality Ender-3 S1, which produced 2,310 errors on a healthy print).
# **This does change rule behaviour**, in three ways, and the file's convention is to say so
# precisely:
#
#   1. `max-flow`, `bead-volume` and the two first-layer rules gained a *path* precondition, via two
#      new helpers `traverses_path` (`s.length > 0`) and `deposits_along_path`
#      (`!travel && traverses_path && volume > 0`). An imported E-only retract/prime line has
#      `travel: false` and a `volume` recovered from `E` but zero geometric length, and was being
#      scored as a deposition rate (813 identical `flow 96.211 mm³/s` errors on that one file) and as
#      a bead against an expected volume of `0 × w × h`.
#   2. The two retraction rules gained a *stationary* precondition (`!traverses_path`), so they judge
#      a pure retraction rather than a slicer wipe that retracts while traversing (684 errors on that
#      file, every one an `X Y E` move at the wipe feedrate).
#   3. `junction-velocity` now compares `min(v_a, v_b)` against the allowed corner velocity
#      `scv·sqrt((√2−1)·cos(φ/2)/(1−cos(φ/2)))` instead of the vector `‖v_b·t̂_b − v_a·t̂ₐ‖` against
#      `scv` directly. Both halves live in `optimize/adaptive_speed.rs`
#      (`junction_cos_half_angle`, `junction_velocity_limit_mm_s`), shared with `adaptive_speed`.
#
# **None of it is tolerance-bearing.** All three are exact comparisons: `> 0.0` and `== 0.0` on
# `length`/`volume`/`filament`, and `>` between two velocities. No epsilon is introduced, removed or
# retuned; no constant below changes; and none of the four boundaries' `operation` text moves —
# `continuity`, `segment-length`/`arc-length`, `filament-consistency` and `arc-radius` are untouched in
# both predicate and epsilon, and each still fires at Error.
#
# Two adjacent facts recorded because they touch pinned predicates without changing them:
#  - `filament-consistency` deliberately keeps its own `!travel && volume > 0 && filament > 0` gate
#    rather than adopting `deposits_along_path`. The ratio `volume/filament` is the feedstock
#    cross-section and is exactly as valid on a zero-length prime move as on a bead, so narrowing it
#    would lose coverage for no reason. The FILAMENT_RATIO boundary's `operation` text is verbatim what
#    the code still does.
#  - `junction_contiguous`'s 0.1 mm threshold is unchanged and is not an entry here (it suppresses a
#    warning rather than raising one); it is inventoried in
#    `proofs/verify-tolerance-numeric-profile-v0.toml`.
#
# One golden finding was legitimately lost and is recorded rather than worked around:
# `conformance/reports/wellformedness/verify.json` no longer carries a `bead-volume` error on the
# negative-length probe (segment 2), because `deposits_along_path` requires a positive length. That
# segment still raises `negative-quantity` ("length is -10") and `segment-length`, both Error, so no
# defect escapes; what is gone is a third report of one defect, which had been comparing a positive
# volume against a *negative* expected bead. `> 0.0` was chosen over `!= 0.0` deliberately: it is
# NaN-safe, so a non-finite length skips these rules instead of comparing against NaN, and `finite`
# already reports it.
# Re-pinned again in the same slice, for one stale in-module test comment: the doc comment on
# `junction_over_scv_is_a_junction_velocity_warning` still described the fixture in terms of the
# scalar Delta-v it no longer measures. Comment only -- no code, no predicate, no epsilon.
