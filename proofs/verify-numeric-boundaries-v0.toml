id = "FM1.F64.VERIFY.ARC_RADIUS"
title = "An arc's two endpoint radii must agree, and one epsilon decides that everywhere it is asked"
rust_symbol = "arc_radius_error"
source_path = "crates/verify/src/lib.rs"
source_anchor = "let tolerance = ARC_RADIUS_TOLERANCE_MM * start_radius.max(end_radius).max(1.0);"
inputs = ["Segment.start", "Segment.end", "Segment.centre", "Op::Arc.cx", "Op::Arc.cy"]
operation = "With r0 = hypot(start - centre) and r1 = hypot(end - centre), both required > 0: fire when |r0 - r1| > 1e-6 * max(r0, r1, 1). Applied twice on the same constant - by verify's `arc-radius` rule on a Segment, and by resolve's L1 gate on an Op::Arc, which imports the constant rather than restating it. An arc with an undefined start or end X/Y is reported as missing geometry instead, and is not measured by this predicate."
classification = "interval-bounded"
numeric_status = "bounded"
assumptions = [
  "The two radii are computed by the same hypot on the same centre, so the predicate compares a producer against itself and not two derivations.",
  "Hybrid form (absolute below 1 mm, relative above) for the reason recorded on COMPARED_COORDINATE_MM: at large coordinates the binary64 spacing alone exceeds a fixed 1e-6 mm.",
  "resolve.rs imports the constant straight from drymachina-contracts, so the two pins above cover the L1 gate as well as the rule: the slice on crates/contracts/src/lib.rs holds the epsilon, the file pin on verify.rs holds the predicate that applies it. A second literal in either would be outside this entry.",
]
exclusions = [
  "The emit path. `dry emit` runs no verifier (ADR 0002 §1) and no emitter re-applies this epsilon, so IR loaded straight from disk reaches a program without this check. It matters most for `emit/krl.rs`: a KRL CIRC is refitted through three points and keeps no trace of the IR centre, where RS-274 preserves it in I/J and leaves the contradiction visible downstream.",
  "Which of the two radii is the intended one. The rule states only that the IR contradicts itself; it does not choose a repair, and nothing clamps.",
  "Arcs whose start or end X/Y is undefined, which fail an earlier structural check rather than this one.",
]
next_obligation = "If any emitter starts applying this epsilon, that application has a different input domain (an emitted pose, not an IR quantity) and needs its own boundary in the emit inventory rather than an extension of this one."
evidence = [
  "crates/verify/src/lib.rs",
  "crates/kernel/src/resolve.rs",
  "crates/kernel/src/emit/krl.rs",
]
claim_ids = ["FM1.VERIFIER_SOUNDNESS.MODEL.SEMANTICS"]
