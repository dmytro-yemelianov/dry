# Bounded resolve-channels source mutation manifest.
# Covers flow, temperature, fan, tool, and power channel propagation during resolution.
schema_version = 1
model = "resolve-channels-source-mutations-v0"
source = "crates/core/src/resolve.rs"
# Re-pinned 2026-08-30 for fluent SDK, clothoid, and lathe additions.
# Re-pinned 2026-08-30 for a rustfmt-only reformat of resolve.rs (line wrapping in
# `Design::feedrate` and `Design::verify`); no mutated expression changed.
source_sha256 = "a11bae910040222815f1e6a0c0d3912e9b85c5cfa51b69c25116b0c69031fb4f"
test = "crates/core/tests/resolve_channels_refinement.rs"

[[mutation]]
id = "flow-default-not-omitted"
witness = "default-channels"
description = "Emit explicit flow field even when flow ratio equals default 1.0."
old = "let flow_field = if flow == 1.0 { None } else { Some(flow) };"
new = "let flow_field = Some(flow);"


[[mutation]]
id = "temperature-does-not-propagate"
witness = "temp-fan-tool-propagation"
description = "Ignore temperature channel state updates during resolution."
old = "Op::Temperature { nozzle } => temp = Some(nozzle),"
new = "Op::Temperature { .. } => {}"

[[mutation]]
id = "fan-does-not-propagate"
witness = "temp-fan-tool-propagation"
description = "Ignore fan channel state updates during resolution."
old = "Op::Fan { speed } => fan = Some(speed),"
new = "Op::Fan { .. } => {}"

[[mutation]]
id = "tool-does-not-propagate"
witness = "temp-fan-tool-propagation"
description = "Ignore tool channel state updates during resolution."
old = "Op::Tool { index } => tool = Some(index),"
new = "Op::Tool { .. } => {}"

[[mutation]]
id = "dwell-ignores-temperature"
witness = "dwell-inherits-channels"
description = "Do not attach active temperature state to dwell segments."
old = '''
                kind: SegmentKind::Dwell,
                centre: None,
                clockwise: false,
                temperature: temp,
'''
new = '''
                kind: SegmentKind::Dwell,
                centre: None,
                clockwise: false,
                temperature: None,
'''

[[mutation]]
id = "power-does-not-propagate"
witness = "power-propagation"
description = "Ignore power channel state updates during resolution."
old = "Op::Power { level } => power = Some(level),"
new = "Op::Power { .. } => {}"

