schema_version = 1

[[clause]]
id = "DRY.QUANTITY.DIMENSION_V0"
title = "Quantities retain their declared dimensions and compatible-unit normalization"
source = "docs/20-dry-ir-ecosystem-implementation-plan.md"
section = "§6.1 Quantities"
normative_text = "Public quantities are dimension-safe and normalize accepted units into canonical internal units."

[[clause]]
id = "DRY.FEATURE.EXPANSION_V0"
title = "Feature expansion is ordered, bounded, deterministic, and parent-first"
source = "docs/20-dry-ir-ecosystem-implementation-plan.md"
section = "§6.2 Frames and poses; §7 Milestone C"
normative_text = "Feature and repeat expansion preserves source order, explicit budgets, and local-before-parent pose composition."

[[clause]]
id = "DRY.NUMERIC.PLANAR_BINARY64_V0"
title = "Planar binary64 boundaries carry explicit numeric profiles"
source = "docs/21-mathematical-assurance-plan.md"
section = "FM1.4 Floating-point and curve error budgets"
normative_text = "Floating-point claims identify their domain, profiles, imported premises, and unresolved refinement obligations."

[[clause]]
id = "DRY.IR.L2_WELL_FORMED_V0"
title = "L2 toolpaths obey the published segment and well-formedness rules"
source = "docs/10-dry-ir-v0-spec.md"
section = "§3 Data model; §9 Conformance model"
normative_text = "L2 segments use the published structure and invalid logical toolpaths are rejected."

[[clause]]
id = "DRY.IR.CODEC_V0"
title = "JSON, DRY0, and DRY1 are versioned interchange boundaries"
source = "docs/10-dry-ir-v0-spec.md"
section = "§4 JSON wire form; §5 DRY0; §6 DRY1; §7 Version semantics"
normative_text = "Published interchange formats preserve versioned logical toolpath data with documented errors and compatibility rules."

[[clause]]
id = "DRY.RESOLVE.ORIENTATION_V0"
title = "Orientation state is explicit, last-write-wins, and attached at emission"
source = "docs/20-dry-ir-ecosystem-implementation-plan.md"
section = "§6.2 Frames and poses"
normative_text = "Toolframe orientation is explicit L1 state; omitted orientation denotes the default tool direction."

[[clause]]
id = "DRY.RESOLVE.CHANNELS_V0"
title = "Typed process channels propagate through ordered lowering"
source = "docs/20-dry-ir-ecosystem-implementation-plan.md"
section = "§6.3 Channels"
normative_text = "Process channels have declared defaults, propagation rules, and compatibility behavior."

[[clause]]
id = "DRY.DEPOSITION.MATH_V0"
title = "Deposition math follows the declared bead and material equations"
source = "docs/20-dry-ir-ecosystem-implementation-plan.md"
section = "§6.1 Quantities; §6.3 Channels"
normative_text = "Deposition quantities use the typed physical dimensions and process channels defined by the language boundary."

[[clause]]
id = "DRY.REPORT.METRICS_V1"
title = "Simulation and trace reports expose validated metric summaries"
source = "docs/11-profiles-and-reports.md"
section = "§3 Report outputs"
normative_text = "Report schemas define the metric summaries and located evidence exposed to independent consumers."

[[clause]]
id = "DRY.REPORT.VERIFIER_RULES_V1"
title = "Verifier rules are explicit, located, and coverage-aware"
source = "docs/11-profiles-and-reports.md"
section = "§2 Verification rule catalog; §3.1 VerifyReport"
normative_text = "Verification reports identify the executed contracts and findings rather than implying unmodeled safety."

[[clause]]
id = "DRY.OPTIMIZATION.OBSERVATION_V0"
title = "Optimization passes declare their observation relation"
source = "docs/21-mathematical-assurance-plan.md"
section = "FM1.6 Optimization pass contracts"
normative_text = "An optimization claim names the exact, bounded, or intentionally changing observation it preserves."

[[clause]]
id = "DRY.CAPABILITY.MATCHING_V0"
title = "Capability matching fails closed at the machine boundary"
source = "docs/20-dry-ir-ecosystem-implementation-plan.md"
section = "§6.4 Capabilities and requirements; §7 Milestone D1.6"
normative_text = "Target selection rejects requirements that exceed the selected machine and process capability profile."

# Added for the TPMS option surface, which had no clause because it had no claim. The generator is the
# only one published on all three SDKs and its option bundle is deserialized from raw JSON on two of
# them, so the acceptance boundary is public whether or not it was ever written down.
[[clause]]
id = "DRY.GENERATE.TPMS_OPTIONS_V1"
title = "The TPMS option bundle has a published domain and refuses out-of-domain values"
source = "docs/07-tpms-codegen.md"
section = "§Decisions; §Limits"
normative_text = "Each TPMS generator option has a published type and domain, and an out-of-domain bundle is refused with a structured error before any geometry is produced."

[[clause]]
id = "DRY.GEOMETRY.BREP_SURFACE_V0"
title = "B-Rep analytical surface quadrics yield exact orthogonal unit surface normals"
source = "docs/21-mathematical-assurance-plan.md"
section = "FM1.3 Transform, feature and frame proofs"
normative_text = "B-Rep analytical surface primitives evaluate exact unit normal spatial vectors."

[[clause]]
id = "DRY.OPTIMIZATION.SCURVE_BOUNDS_V0"
title = "S-curve velocity profiles enforce bounded jerk and acceleration limits"
source = "docs/21-mathematical-assurance-plan.md"
section = "FM1.4 Floating-point and curve error budgets"
normative_text = "S-curve 7-phase profile planning strictly bounds kinematic jerk and acceleration within configured limits."

