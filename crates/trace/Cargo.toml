[package]
name = "drymachina-trace"
description = "DRYMACHINA layer 3: trace analytics, review reports, forensics, comparison, explanation, recommendation and reverse inference."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

# Layer 3 is the top of the stack: it reads the kernel's geometry, the verifier's findings and the
# vocabulary both speak, and nothing depends on it. That is what lets it graduate to its own
# repository first (plan Task 8) — so these three paths are the whole of its inward surface.
[dependencies]
drymachina-contracts = { path = "../contracts" }
drymachina-kernel = { path = "../kernel" }
drymachina-verify = { path = "../verify" }
serde = { version = "1", features = ["derive"] }
# Not dev-only, unlike `drymachina-verify` and `drymachina-contracts`: `explain.rs` serialises the three grounding
# reports into the LLM bundle's prompt, so this crate writes JSON in anger. `float_roundtrip` is the
# same requirement `dry-core` states for the IR — serde_json's default parser is accurate only to
# within 1 ULP — and it is load-bearing here too: `compare_golden.rs` re-parses the committed
# `CompareDelta` golden and re-serialises it to compare, so a one-bit parse would fail the drift gate.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The same deterministic libm the kernel resolves and emits with. `forensics.rs` infers infill angle
# and spacing with cos/sin/sqrt/hypot/atan2 (four call sites), and an inference that disagreed with
# the geometry it is drawn from would report a slicer setting the toolpath does not have.
libm = "0.2"

# No `serde_json` here: it is a normal dependency above, and a dev entry would only restate it —
# feature unification means the `float_roundtrip` build is what the tests link either way, so the
# second entry could not weaken it and could only contradict the comment that explains it.
[dev-dependencies]
# Benchmark harness (dev-only). default-features off to skip the heavy plotting/rayon stack — the
# CI `bench` job only needs the benches to compile and run (docs/13-performance-and-scale.md).
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "trace_pass"
harness = false
