# This crate is a thin wasm-bindgen adapter: `resolve_verify` mirrors the Python SDK's verify entry
# point, exposing every typed Contracts field, so it naturally carries more parameters than clippy's
# default `too_many_arguments` threshold (7). Raising the threshold here is the structural fix for that
# boundary shape — the binding stays `-D warnings` clean with no per-item `#[allow]` silencing.
too-many-arguments-threshold = 12
