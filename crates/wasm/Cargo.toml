# Standalone workspace root: the engine workspace (../../Cargo.toml) excludes this binding crate, but
# cargo still walks parent directories looking for an owning workspace. An empty `[workspace]` table
# marks dry-wasm as its own root so it builds with `--manifest-path` even from a nested git worktree
# (where the parent repo's workspace would otherwise claim, then reject, this crate).
[workspace]

[package]
name = "dry-wasm"
description = "wasm-bindgen binding for Dry — the toolpath compiler engine, in the browser / Node."
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
license-file = "../../LICENSE"
repository = "https://github.com/dmytro-yemelianov/dry"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dry-core = { path = "../core" }
# pinned to the installed wasm-bindgen CLI version (the .wasm and the JS glue must match exactly).
wasm-bindgen = "=0.2.123"
serde_json = "1"
