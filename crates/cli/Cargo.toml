[package]
name = "dry-cli"
description = "Dry CLI — inspect / simulate / emit a Dry IR toolpath."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dry"
path = "src/main.rs"

[features]
llm = ["dep:dry-llm"]
moonraker = ["dep:dry-moonraker"]

[dependencies]
dry-core = { path = "../core" }
dry-llm = { path = "../llm", optional = true }
dry-moonraker = { path = "../moonraker", optional = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
