[package]
name = "dry-cli"
description = "DryMachina CLI — inspect, simulate, verify, and emit deterministic toolpaths."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dry"
path = "src/main.rs"

[features]
default = ["moonraker"]
llm = ["dep:dry-llm"]
moonraker = ["dep:dry-moonraker"]

[dependencies]
dry-core = { version = "0.10.0", path = "../core" }
dry-license = { version = "0.10.0", path = "../license" }
dry-llm = { version = "0.10.0", path = "../llm", optional = true }
dry-moonraker = { version = "0.10.0", path = "../moonraker", optional = true }
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json", "tls"] }
