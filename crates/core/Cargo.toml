[package]
name = "dry-core"
description = "Dry IR + engine: the dependency-light core (no PyO3/numpy). LLVM/MLIR for machine motion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

# The core stays dependency-light and compiles to wasm32-unknown-unknown unmodified. serde/serde_json
# (the JSON IR encoding) plus miniz_oxide (pure-Rust DEFLATE for the compact columnar binary encoding)
# are all wasm-friendly. PyO3/numpy/native bindings live in sibling crates, never here.
[dependencies]
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is required, not an optimisation: serde_json's default parser is accurate only to
# within 1 ULP, so without it `Toolpath::from_json(tp.to_json())` can come back one bit off for a
# 17-significant-digit coordinate — which is exactly what the IR v0 spec (docs/10, §9) forbids when it
# defines conformance as bit-exact f64 equality. Pinned by the five_axis_drape conformance vector,
# whose resolved lengths and volumes are the first in the corpus long enough to expose it.
serde_json = { version = "1", features = ["float_roundtrip"] }
miniz_oxide = "0.9"
libm = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exact dyadic witnesses for the native f64 feature-operation graph.
num-bigint = "0.5"
num-traits = "0.2"
# Used only by tests/spec_vectors.rs to hash the public conformance-vector artifacts into MANIFEST.json
# (the same hashes the independent Python validator checks). Dev-only: never linked into the engine.
sha2 = "0.11"
# Benchmark harness (dev-only). default-features off to skip the heavy plotting/rayon stack — the CI
# `bench` job only needs the benches to compile and run (docs/13-performance-and-scale.md).
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "engine_codec"
harness = false
