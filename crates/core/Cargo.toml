[package]
name = "dry-core"
description = "Dry IR + engine: the dependency-light core (no PyO3/numpy). LLVM/MLIR for machine motion."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The core stays dependency-light and compiles to wasm32-unknown-unknown unmodified. serde/serde_json
# (the JSON IR encoding) plus miniz_oxide (pure-Rust DEFLATE for the compact columnar binary encoding)
# are all wasm-friendly. PyO3/numpy/native bindings live in sibling crates, never here.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
libm = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
