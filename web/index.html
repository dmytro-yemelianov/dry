<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dry Machina — Universal CAM Studio</title>
  <meta name="description" content="Pro-Grade Multi-Process CAM Studio for 3D Printing, CNC Milling, Laser, Plasma, and 5-Axis Robotics.">
  <link rel="stylesheet" href="studio.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
</head>
<body>

<!-- Studio Top Header -->
<header class="studio-header">
  <div class="brand-section">
    <a href="/" class="brand-logo">
      <span class="core-dot"></span>
      Dry Machina
    </a>
    <span class="badge-version">Studio 2.0</span>
  </div>

  <div class="machine-select-wrapper">
    <label for="machineSelect">Machine:</label>
    <select id="machineSelect" class="machine-select"></select>
  </div>

  <div class="process-tabs">
    <button class="process-tab active" data-process="fdm">3D Printing</button>
    <button class="process-tab" data-process="cnc">CNC Mill</button>
    <button class="process-tab" data-process="laser">Laser</button>
    <button class="process-tab" data-process="plasma">Plasma</button>
    <button class="process-tab" data-process="robotics">5-Axis RTCP</button>
  </div>

  <div class="header-actions">
    <a href="/web/machines.html" class="btn-action">Machines</a>
    <a href="/web/docs.html" class="btn-action" target="_blank">Docs & Specs</a>
    <button id="exportGcodeBtn" class="btn-action primary">Export G-Code</button>
  </div>
</header>

<!-- Main Workspace (3-Column Architecture) -->
<main class="studio-main">
  <!-- Left Sidebar: Design Gallery & File Dropper -->
  <aside class="sidebar-left">
    <div class="panel-header">
      <span>Generative Toolpath Library</span>
    </div>
    <div class="panel-content">
      <input type="text" id="gallerySearch" class="gallery-search-input" placeholder="Search 50+ designs & lattices...">
      
      <div class="filter-pills">
        <button class="filter-pill active" data-cat="all">All</button>
        <button class="filter-pill" data-cat="vases">Vases & 3D</button>
        <button class="filter-pill" data-cat="tpms">TPMS</button>
        <button class="filter-pill" data-cat="lattices">Lattices</button>
        <button class="filter-pill" data-cat="infill">Infill</button>
        <button class="filter-pill" data-cat="fullcontrol">FullControl</button>
      </div>

      <div class="gallery-list" id="galleryList"></div>

      <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 14px;">
        <div class="panel-header" style="background: transparent; padding: 0 0 8px; height: auto;">
          <span>Custom G-Code / STEP-NC</span>
        </div>
        <div style="border: 1px dashed var(--border); border-radius: 6px; padding: 12px; text-align: center; font-size: 11px; color: var(--fg-muted);">
          Drag and drop <code>.gcode</code>, <code>.nc</code>, or <code>.stepnc</code> files to inspect in 3D.
        </div>
      </div>
    </div>
  </aside>

  <!-- Center 3D Viewport -->
  <div class="viewport-center">
    <div class="viewport-overlay-tools">
      <button class="view-btn active" data-view="iso">Iso</button>
      <button class="view-btn" data-view="top">Top</button>
      <button class="view-btn" data-view="front">Front</button>
      <button class="view-btn" data-view="side">Side</button>
    </div>

    <div class="color-mode-tools">
      <button class="color-mode-btn active" data-mode="type">Pass Type</button>
      <button class="color-mode-btn" data-mode="height">Z-Height</button>
      <button class="color-mode-btn" data-mode="speed">Speed Heatmap</button>
    </div>

    <div class="engine-status-tag">
      <span class="status-pulse"></span>
      WASM Engine Active (0ms)
    </div>

    <div id="viewport3d"></div>
  </div>

  <!-- Right Sidebar: Safety, Telemetry, G-Code & Optimizer -->
  <aside class="sidebar-right">
    <div class="panel-header" style="padding: 0;">
      <div class="panel-tabs">
        <button class="panel-tab-btn active" onclick="switchRightTab('tabSafety')">Safety</button>
        <button class="panel-tab-btn" onclick="switchRightTab('tabTelemetry')">Telemetry</button>
        <button class="panel-tab-btn" onclick="switchRightTab('tabGcode')">G-Code</button>
        <button class="panel-tab-btn" onclick="switchRightTab('tabOptimizer')">Optimizer</button>
      </div>
    </div>

    <div class="panel-content">
      <!-- 1. Safety Tab -->
      <div id="tabSafety" class="tab-pane active">
        <div id="safetyStatus"></div>
      </div>

      <!-- 2. Telemetry Tab -->
      <div id="tabTelemetry" class="tab-pane" style="display: none;">
        <div class="stat-grid">
          <div class="stat-box">
            <div class="title">Duration</div>
            <div><span class="val" id="statDuration">0.0</span><span class="unit">s</span></div>
          </div>
          <div class="stat-box">
            <div class="title">Total Travel</div>
            <div><span class="val" id="statLength">0</span><span class="unit">mm</span></div>
          </div>
          <div class="stat-box">
            <div class="title">Volume</div>
            <div><span class="val" id="statVolume">0.0</span><span class="unit">mm³</span></div>
          </div>
          <div class="stat-box">
            <div class="title">Material Mass</div>
            <div><span class="val" id="statMass">0.0</span><span class="unit">g</span></div>
          </div>
        </div>
      </div>

      <!-- 3. G-Code Tab -->
      <div id="tabGcode" class="tab-pane" style="display: none; height: 100%;">
        <div class="gcode-viewer-table" id="gcodeViewer"></div>
      </div>

      <!-- 4. Optimizer Tab -->
      <div id="tabOptimizer" class="tab-pane" style="display: none;">
        <div id="optimizerDiffs"></div>
      </div>
    </div>
  </aside>
</main>

<!-- Bottom Playback Controller -->
<footer class="studio-playback">
  <button id="playBtn" class="playback-play-btn">▶</button>
  <div class="timeline-slider-wrapper">
    <input type="range" id="timelineSlider" class="timeline-slider" min="0" max="100" value="0">
    <span id="timelineLabel" class="timeline-label">0.0s / 10.0s</span>
  </div>
  <div class="speed-selector">
    <button class="speed-btn" data-speed="0.25">0.25×</button>
    <button class="speed-btn" data-speed="0.5">0.5×</button>
    <button class="speed-btn active" data-speed="1.0">1×</button>
    <button class="speed-btn" data-speed="4.0">4×</button>
    <button class="speed-btn" data-speed="16.0">16×</button>
    <button class="speed-btn" data-speed="64.0">64×</button>
  </div>
</footer>

<script type="module">
import { initStudio } from './studio.js?v=2.1.0';

window.addEventListener('DOMContentLoaded', () => {
  initStudio();
});

window.switchRightTab = function(tabId) {
  document.querySelectorAll('.panel-tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.sidebar-right .tab-pane').forEach(pane => pane.style.display = 'none');
  
  event.target.classList.add('active');
  document.getElementById(tabId).style.display = 'block';
};
</script>

</body>
</html>
