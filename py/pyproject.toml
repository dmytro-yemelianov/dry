[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "dry"
version = "0.7.0"
description = "Dry — author algorithmic machine toolpaths in Python; the Rust engine does the rest."
readme = "../README.md"
authors = [{ name = "Dmytro Yemelianov", email = "dmytro@yemelianov.dev" }]
requires-python = ">=3.9"
license = "FSL-1.1-MIT"
license-files = ["LICENSE", "NOTICE", "third_party/licenses/*.txt"]

[project.urls]
Homepage = "https://github.com/dmytro-yemelianov/dry"
Repository = "https://github.com/dmytro-yemelianov/dry"
Documentation = "https://github.com/dmytro-yemelianov/dry"

[tool.maturin]
module-name = "dry._native"
python-source = "python"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
pythonpath = ["python"]

