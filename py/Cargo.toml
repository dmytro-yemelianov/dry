[package]
name = "dry-py"
description = "PyO3 binding for Dry — the toolpath compiler engine, callable from Python."
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
repository = "https://github.com/dmytro-yemelianov/dry"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
dry-core = { path = "../crates/core" }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
